name: Recover LP publication

on:
  workflow_dispatch:
    inputs:
      collection_run:
        description: Completed main-branch Collect LP programs run with retained evidence
        required: true
        type: string
      kexim_stage_evidence_run:
        description: Optional successful bounded KEXIM screening proof capture for this collection
        required: false
        type: string
      retry_failed_institutions:
        description: Retry at most two failed issuers and one failed association stream
        required: false
        type: boolean
        default: false
      institution_evidence_run:
        description: Optional successful recovery run for the same collection; reuse its issuer evidence without HTTP
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: lp-program-collection
  cancel-in-progress: false
jobs:
  publish:
    # Must replay scanned-PDF evidence with the same bounded Vision reader.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Verify collection provenance before reading artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_RUN: ${{ inputs.collection_run }}
          INSTITUTION_EVIDENCE_RUN: ${{ inputs.institution_evidence_run }}
          GH_REPO: ${{ github.repository }}
          KEXIM_STAGE_RUN: ${{ inputs.kexim_stage_evidence_run }}
        run: |
          python3 - <<'PY'
          import datetime,json,os,subprocess
          run=os.environ['COLLECTION_RUN']
          assert run.isascii() and run.isdecimal(), 'Numeric Actions run required'
          source=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/actions/runs/{run}"]))
          assert source['repository']['full_name']==os.environ['GH_REPO']
          assert source['path']=='.github/workflows/collect-kgrowth-programs.yml'
          assert source['head_branch']=='main' and source['event'] in {'schedule','workflow_dispatch'}
          assert source['status']=='completed', 'Wait for the source collection to finish'
          created=datetime.datetime.fromisoformat(source['created_at'].replace('Z','+00:00'))
          assert datetime.timedelta(0)<=datetime.datetime.now(datetime.timezone.utc)-created<=datetime.timedelta(hours=48), 'Use recent evidence only'
          print(json.dumps({k:source[k] for k in ('id','head_sha','event','conclusion','created_at')}))
          saved=os.environ.get('INSTITUTION_EVIDENCE_RUN','')
          if saved:
              assert saved.isascii() and saved.isdecimal(),'Numeric recovery run required'
              previous=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/actions/runs/{saved}"]))
              assert previous['repository']['full_name']==os.environ['GH_REPO']
              assert previous['path']=='.github/workflows/recover-lp-publication.yml'
              assert previous['head_branch']=='main' and previous['event']=='workflow_dispatch'
              assert previous['status']=='completed' and previous['conclusion']=='success','Use a completed successful recovery'
              saved_at=datetime.datetime.fromisoformat(previous['created_at'].replace('Z','+00:00'))
              assert created<=saved_at<=datetime.datetime.now(datetime.timezone.utc),'Recovery predates source collection'
              print(json.dumps({'reused_institution_evidence_run':previous['id'],'head_sha':previous['head_sha']}))
          stage_run=os.environ.get('KEXIM_STAGE_RUN','')
          if stage_run:
              assert stage_run.isascii() and stage_run.isdecimal() and int(stage_run)>0
              stage=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/actions/runs/{stage_run}"]))
              assert stage['repository']['full_name']==os.environ['GH_REPO']
              assert stage['path']=='.github/workflows/diagnose-lp-board-http.yml'
              assert stage['head_branch']=='main' and stage['event']=='workflow_dispatch'
              assert stage['status']=='completed' and stage['conclusion']=='success'
              stage_at=datetime.datetime.fromisoformat(stage['created_at'].replace('Z','+00:00'))
              assert created<=stage_at<=datetime.datetime.now(datetime.timezone.utc)
              print(json.dumps({'kexim_stage_evidence_run':stage['id'],'head_sha':stage['head_sha']}))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: kgrowth-collection
          run-id: ${{ inputs.collection_run }}
          github-token: ${{ github.token }}
          path: /tmp/lp-recovery
      - uses: actions/download-artifact@v4
        if: inputs.institution_evidence_run != ''
        with:
          name: lp-publication-recovery
          run-id: ${{ inputs.institution_evidence_run }}
          github-token: ${{ github.token }}
          path: /tmp/lp-retained-institution
      - uses: actions/download-artifact@v4
        if: inputs.kexim_stage_evidence_run != ''
        with:
          name: kexim-result-proof
          run-id: ${{ inputs.kexim_stage_evidence_run }}
          github-token: ${{ github.token }}
          path: /tmp/lp-kexim-stage
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install publication readers
        run: python3 -m pip install 'psycopg[binary]==3.2.10' 'pypdf==6.10.0' 'olefile==0.47' 'truststore==0.10.5'
      - name: Reuse completed institution recovery and preserve healthy source receipts
        if: inputs.institution_evidence_run != ''
        run: |
          python3 -m unittest services.lp.tests.test_retry_lp_failed_sources
          python3 - <<'PY'
          import json
          from pathlib import Path
          from services.lp.src.retry_lp_failed_sources import reuse_institution_evidence
          path=Path('/tmp/lp-recovery/lp-institution-collection.json')
          original=json.loads(path.read_text())
          recovered=json.loads(Path('/tmp/lp-retained-institution/lp-institution-collection.json').read_text())
          result=reuse_institution_evidence(original,recovered)
          path.write_text(json.dumps(result,ensure_ascii=False))
          print(json.dumps({'retained_institution_notices':len(result['notices']),'official_http_requests':0}))
          PY
      - name: Retry bounded failed sources and retain both attempts
        if: inputs.retry_failed_institutions
        env:
          LP_SOURCE_WORKER_TOKEN: ${{ secrets.LP_SOURCE_WORKER_TOKEN }}
        run: |
          python3 -m unittest services.lp.tests.test_retry_lp_failed_sources
          python3 services/lp/src/retry_lp_failed_sources.py --directory /tmp/lp-recovery
      - name: Reuse one raw-verified automatic KEXIM screening stage without HTTP
        if: inputs.kexim_stage_evidence_run != ''
        env:
          COLLECTION_RUN: ${{ inputs.collection_run }}
        run: |
          python3 -m unittest services.lp.tests.test_kexim_followup services.lp.tests.test_reuse_kexim_stage_evidence
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from services.lp.src.reuse_kexim_stage_evidence import reuse_stage_evidence
          root=Path('/tmp/lp-kexim-stage')
          result=json.loads((root/'result.json').read_text())
          provenance=json.loads((root/'provenance.json').read_text())
          assert str(provenance['COLLECTION_RUN']['id'])==os.environ['COLLECTION_RUN']
          assert result['success'] is True and result['published'] is False
          assert result['listing_requests']==0 and result['detail_requests']==1 and result['attachment_requests']==1
          assert result['database_writes']==0 and result['previous_attachment_hash_equal'] is True
          path=Path('/tmp/lp-recovery/lp-priority-collection.json')
          priority=json.loads(path.read_text())
          notice=json.loads((root/'notice.json').read_text())
          assert result['source_id']==notice['source_id']
          upgraded,receipt=reuse_stage_evidence(priority['sources']['kexim'],notice,
                                               (root/'detail-response.bin').read_bytes(),
                                               (root/'attachment-response.bin').read_bytes())
          priority['sources']['kexim']=upgraded
          path.write_text(json.dumps(priority,ensure_ascii=False))
          Path('/tmp/lp-recovery/kexim-stage-reuse.json').write_text(json.dumps(receipt,ensure_ascii=False))
          print(json.dumps(receipt,ensure_ascii=False))
          PY
      - name: Replay source proofs and preserve existing public programs
        env:
          PYTHONPATH: services/lp/src
          NEWSLETTER_SKIP_BRAND_ASSET_DOWNLOADS: '1'
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KEXIM_STAGE_RUN: ${{ inputs.kexim_stage_evidence_run }}
        run: |
          python3 - <<'PY'
          import copy,json,os,tempfile
          from datetime import datetime,timezone
          from pathlib import Path
          from publish_lp_programs import connect,baseline,prepare
          from lp_program_service import validate,assert_selected_gp_history
          root=Path('/tmp/lp-recovery')
          report=json.loads((root/'kgrowth-collection.json').read_text())
          report['priority_sources']=json.loads((root/'lp-priority-collection.json').read_text())['sources']
          for name in ('shared','institution'):
              report[name+'_collection']=json.loads((root/f'lp-{name}-collection.json').read_text())
          report['collection_checked_at']=report['checked_at']
          report['checked_at']=datetime.now(timezone.utc).isoformat()
          with connect() as conn:
              conn.execute('SET TRANSACTION READ ONLY')
              old=baseline(conn)
          (root/'baseline.json').write_text(json.dumps(old,ensure_ascii=False))
          data,pages=prepare(copy.deepcopy(old),report)
          validate(data)
          assert_selected_gp_history(old['programs'],data['programs'])
          after={p['id']:p for p in data['programs']}
          for previous in old['programs']:
              assert previous['id'] in after, 'Previously published program missing'
              current=after[previous['id']]
              assert {e['url'] for e in previous['events']} <= {e['url'] for e in current['events']}, 'Existing source URL missing'
              if previous['institution_id'] in {'sema','mmaa','kfinco'}:
                  for field in ('commitment_amount_krw','manager_count','deadline'):
                      if field in previous: assert current.get(field)==previous[field], 'Existing public field changed: '+field
          if os.environ.get('KEXIM_STAGE_RUN'):
              receipt=json.loads((root/'kexim-stage-reuse.json').read_text())
              before={p['id']:p for p in old['programs']}
              assert set(before)==set(after),'Screening replay cannot introduce/remove public businesses'
              previous=before[receipt['program_id']];current=after[receipt['program_id']]
              assert current['status']=='서류심사 결과' and len(current['shortlisted_gps'])==receipt['screening_count']
              assert current.get('selected_gps',[])==previous.get('selected_gps',[]),'Screening is not final selection'
              for field in ('id','title','institution_id','asset_scope','commitment_amount_krw','manager_count','per_fund_amount_krw','deadline','applicants_gps','review_evidence'):
                  assert current.get(field)==previous.get(field),'Existing PE terms changed: '+field
              assert receipt['source_url'] in {e['url'] for e in current['events'] if e['type']=='서류심사 결과'}
              assert set(current['shortlisted_gps'])<=set(previous['applicants_gps'])
          errors=data.get('institution_collection_holds',[])
          assert not any(h.get('stage')=='institution_validation' for h in errors), 'Invalid official receipt'
          new=[p for p in data['programs'] if p['id'] not in {old['id'] for old in old['programs']}]
          for p in new:
              if p['institution_id']=='kbiz':
                  assert not any(p.get(k) for k in ('commitment_amount_krw','manager_count','per_fund_amount_krw')), 'Common PE/VC budget cannot become PE facts'
          old_selections={p['id']:p.get('selected_gps',[]) for p in old['programs']}
          added_gps=[{'program_id':p['id'],'name':gp['name'],'source_url':gp['source_url']}
                     for p in data['programs'] for gp in p.get('selected_gps',[])
                     if not any(all(gp.get(k)==v for k,v in prior.items()) for prior in old_selections.get(p['id'],[]))]
          summary={'programs':len(after),'pages':len(pages),'new_programs':new,'institution_holds':errors,'added_selected_gps':added_gps}
          (root/'preflight.json').write_text(json.dumps(summary,ensure_ascii=False))
          print(json.dumps({'programs':len(after),'pages':len(pages),'new_program_ids':[p['id'] for p in new],'institution_holds':len(errors)}))
          PY
      - name: Publish validated evidence in one transaction
        env:
          NEWSLETTER_SKIP_BRAND_ASSET_DOWNLOADS: '1'
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          python3 services/lp/src/publish_lp_programs.py --collection /tmp/lp-recovery/kgrowth-collection.json --priority-collection /tmp/lp-recovery/lp-priority-collection.json --shared-collection /tmp/lp-recovery/lp-shared-collection.json --institution-collection /tmp/lp-recovery/lp-institution-collection.json | tee /tmp/lp-recovery/publication.json
      - name: Verify all published details and report remaining source failures
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          root=Path('/tmp/lp-recovery')
          publication=json.loads((root/'publication.json').read_text())
          for program in publication['program_ids']:
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(f'https://kpef-lp.vercel.app/program-{program}.html',timeout=30) as response:
                          assert response.headers.get('X-LP-Data-Source')=='supabase'
                          assert response.headers.get('X-LP-Run')==publication['run_id']
                          assert '진행 일정' in response.read().decode()
                      break
                  except Exception:
                      if attempt==2: raise
                      time.sleep(5)
          assert publication['institution_validation_errors']==0
          print('Verified all public details:',publication['programs'],publication['run_id'])
          direct=json.loads((root/'lp-institution-collection.json').read_text())
          shared=json.loads((root/'lp-shared-collection.json').read_text())
          priority=json.loads((root/'lp-priority-collection.json').read_text())
          failures=[h for h in direct.get('holds',[]) if h.get('stage') in {'institution_listing','institution_detail','institution_depth'}]
          failures += [h for h in shared.get('holds',[]) if h.get('stage') in {'listing','detail','original_board'} or (h.get('stage') in {'growth_search','kfinco_original'} and h.get('phase') in {'listing','detail'})]
          failures += [dict(institution_id=k,error=v['error']) for k,v in priority['sources'].items() if v.get('error')]
          (root/'remaining-failures.json').write_text(json.dumps(failures,ensure_ascii=False))
          if failures: raise SystemExit('Publication recovered; official source failures remain: '+json.dumps(failures,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp-publication-recovery
          path: |
            /tmp/lp-recovery/lp-institution-collection.json
            /tmp/lp-recovery/lp-priority-collection.json
            /tmp/lp-recovery/lp-shared-collection.json
            /tmp/lp-recovery/preflight.json
            /tmp/lp-recovery/kexim-stage-reuse.json
            /tmp/lp-recovery/publication.json
            /tmp/lp-recovery/remaining-failures.json
          retention-days: 7
          if-no-files-found: warn
