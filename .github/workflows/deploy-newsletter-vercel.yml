name: Deploy newsletter Vercel app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsletter-vercel
  cancel-in-progress: false

jobs:
  deploy-vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      NEWSLETTER_ARCHIVE_URL: https://pkkong.github.io/kpef-newsletter/archive.json
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node for Vercel CLI
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install newsletter web dependencies
        working-directory: services/newsletter/web
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Check Vercel/Supabase readiness
        run: |
          python3 services/newsletter/scripts/check_vercel_supabase_readiness.py

      - name: Smoke test Flask app
        working-directory: services/newsletter/web
        run: |
          python3 - <<'PY'
          from app import app

          client = app.test_client()
          for path in ["/", "/daily-news.html", "/health.json", "/archive.json"]:
              response = client.get(path)
              if response.status_code != 200:
                  raise SystemExit(f"{path} returned {response.status_code}")
          health = client.get("/health.json").get_json()
          if health.get("service") != "newsletter":
              raise SystemExit(f"unexpected health payload: {health}")
          print(f"newsletter_vercel_smoke=ok report_date={health.get('report_date')} articles={health.get('article_count')}")
          PY

      - name: Stop if Vercel credentials are missing
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        run: |
          echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID are required for Vercel deploy."
          exit 1

      - name: Deploy newsletter app to Vercel
        run: |
          npm install --global vercel@latest
          # Run from repo root because the Vercel project already has Root Directory set.
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel deploy --prod --token "$VERCEL_TOKEN"
