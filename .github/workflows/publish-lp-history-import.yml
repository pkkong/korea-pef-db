name: Publish reviewed LP historical addition

on:
  workflow_dispatch:
    inputs:
      preflight_run:
        description: Successful main-branch read-only history import verification
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: lp-program-collection
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'pkkong/korea-pef-db' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify the read-only run origin
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN: ${{ inputs.preflight_run }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run = os.environ['PREFLIGHT_RUN']
          repo = os.environ['GITHUB_REPOSITORY']
          assert re.fullmatch('[1-9][0-9]{0,19}', run)
          source = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run}']))
          assert source['repository']['full_name'] == repo and source['head_branch'] == 'main'
          assert source['path'] == '.github/workflows/verify-lp-history-import.yml' and source['event'] == 'push'
          assert source['status'] == 'completed' and source['conclusion'] == 'success'
          assert re.fullmatch('[a-f0-9]{40}', source['head_sha'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"LP_HISTORY_PREFLIGHT_SHA={source['head_sha']}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: lp-history-import-check
          run-id: ${{ inputs.preflight_run }}
          github-token: ${{ github.token }}
          path: /tmp/lp-history-import-check
      - name: Match the candidate to the tracked operating request
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          root = Path('/tmp/lp-history-import-check')
          request = json.loads(Path('data/lp_history_import_request.json').read_bytes())
          checked = json.loads((root / 'preflight.json').read_bytes())
          candidate = root / 'candidate-import.json'
          digest = request['sha256']
          baseline = checked['baseline_run_id']
          assert checked['kind'] == 'lp_history_import_preflight_v1' and checked['database_writes'] == 0
          assert checked['published'] is False and checked['existing_programs_preserved'] is True
          assert checked['existing_sources_preserved'] is True and checked['aliases_preserved'] is True
          assert checked['new_programs'] and not checked['reused_program_ids']
          assert checked['source_code_commit'] == os.environ['LP_HISTORY_PREFLIGHT_SHA']
          assert re.fullmatch('[a-f0-9]{24}', baseline) and re.fullmatch('[a-f0-9]{64}', digest)
          assert candidate.stat().st_size == checked['candidate_bytes'] <= 40 * 1024 * 1024
          assert hashlib.sha256(candidate.read_bytes()).hexdigest() == checked['candidate_sha256'] == digest
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'LP_EXPECTED_PUBLICATION_BASELINE={baseline}\nLP_HISTORY_IMPORT_SHA256={digest}\n')
          PY
      - name: Install LP source replay and database dependencies
        run: python3 -m pip install -r services/lp/web/requirements.txt 'psycopg[binary]==3.2.10' 'pypdf==6.10.0' 'olefile==0.47'
      - name: Publish the exact historical addition in one transaction
        env:
          NEWSLETTER_SKIP_BRAND_ASSET_DOWNLOADS: '1'
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -o pipefail
          mkdir -p /tmp/lp-history-import-publication
          python3 services/lp/src/lp_publication_runner.py --status-file /tmp/lp-history-import-publication/publication-status.json --timeout-seconds 840 -- --history-import /tmp/lp-history-import-check/candidate-import.json --history-import-sha256 "$LP_HISTORY_IMPORT_SHA256" | tee /tmp/lp-history-import-publication/publication.json
      - name: Verify the public state, detail pages and aliases
        run: |
          python3 - <<'PY'
          import html, json, time, urllib.request
          from pathlib import Path

          out = Path('/tmp/lp-history-import-publication')
          checked = json.loads(Path('/tmp/lp-history-import-check/preflight.json').read_bytes())
          publication = json.loads((out / 'publication.json').read_bytes())
          assert publication['programs'] == checked['programs_after']
          assert publication['history_notices'] == checked['history_notices_after']
          assert publication['history_validation_errors'] == 0
          run = publication['run_id']
          def fetch(path):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen('https://kpef-lp.vercel.app/' + path + '?refresh=1', timeout=30) as response:
                          if path == 'health.json':
                              state = json.loads(response.read())
                              assert state['status'] == 'ok' and state['run_id'] == run and not state['stale']
                              return state
                          assert response.headers['X-LP-Data-Source'] == 'supabase' and response.headers['X-LP-Run'] == run
                          return response.read().decode()
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(5)
          health = fetch('health.json')
          expected = {p['id']: p for p in checked['new_programs']}
          assert expected.keys() <= set(publication['program_ids'])
          for program in publication['program_ids']:
              detail = fetch(f'program-{program}.html')
              assert '진행 일정' in detail
              for gp in expected.get(program, {}).get('selected_gps', []):
                  assert html.escape(gp['name']) in detail and html.escape(gp['source_url']) in detail
          for old, target in publication['program_aliases'].items():
              assert f'url=program-{target}.html' in fetch(f'program-{old}.html')
          (out / 'public-verification.json').write_text(json.dumps(health))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp-history-import-publication
          path: /tmp/lp-history-import-publication
          retention-days: 30
          if-no-files-found: warn
