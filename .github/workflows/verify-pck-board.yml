name: Verify LP official notice board
on:
  workflow_dispatch:
    inputs:
      institution:
        description: Official board to collect and replay without publication
        type: choice
        options: [pck_pension, sema, ibk, kdb, geps, remaining, nh_central, suhyup, central_screening]
        default: pck_pension
      geps_dns_probe:
        description: GEPS only; force local DNS failure and verify one real listing without DB access
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lp-program-collection
  cancel-in-progress: false
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      LP_INSTITUTION: ${{ inputs.institution || 'pck_pension' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official attachment readers
        run: python3 -m pip install 'pypdf==6.10.0' 'olefile==0.47' 'psycopg[binary]==3.2.10' 'truststore==0.10.5'
      - name: Test observed board and bounded attachment contracts
        run: python3 -m unittest services.lp.tests.test_lp_board_adapter_pck services.lp.tests.test_lp_board_adapter_sema services.lp.tests.test_lp_board_adapter_mmaa services.lp.tests.test_lp_board_adapter_kbiz services.lp.tests.test_lp_board_adapter_geps services.lp.tests.test_lp_board_adapter_kamco services.lp.tests.test_lp_board_adapter_moel services.lp.tests.test_lp_board_adapter_kfinco services.lp.tests.test_lp_kbiz_notice_terms services.lp.tests.test_lp_kfinco_notice_terms services.lp.tests.test_lp_attachment_text services.lp.tests.test_lp_attachment_policy services.lp.tests.test_collect_lp_institution_boards services.lp.tests.test_lp_pck_programs
      - name: Verify GEPS alternate DNS with one controlled official request
        if: inputs.geps_dns_probe
        run: |
          mkdir -p /tmp/lp-board-inspection
          python3 - <<'PY'
          import hashlib,json,os,socket
          from pathlib import Path
          from unittest.mock import patch
          from services.lp.src.collect_lp_institution_boards import Session,load_configs,listing_urls,adapter,_html
          assert os.environ['LP_INSTITUTION']=='geps','DNS probe is GEPS only'
          config=load_configs()['geps']
          url=next(iter(listing_urls(config)))
          original=socket.getaddrinfo
          forced=[]
          def resolve(host,*args,**kwargs):
              if host=='www.geps.or.kr':
                  forced.append(host)
                  raise socket.gaierror(socket.EAI_NONAME,'controlled GEPS local DNS failure')
              return original(host,*args,**kwargs)
          session=Session(config)
          with patch.object(socket,'getaddrinfo',side_effect=resolve):
              raw=session(url)
          html=_html(raw)
          rows=adapter(config).parse_listing(html,url,config)
          assert len(forced)==2 and session.dns_ipv4_fetches==1 and session.alternate_dns_lookups==1,'Expected bounded alternate DNS path'
          result={'controlled_local_dns_failures':len(forced),'official_url':url,'bytes':len(raw),
                  'sha256':hashlib.sha256(raw).hexdigest(),'verified_rows':len(rows),
                  'dns_ipv4_fetches':session.dns_ipv4_fetches,'alternate_dns_lookups':session.alternate_dns_lookups,
                  'publication':False}
          Path('/tmp/lp-board-inspection/geps-dns-probe.json').write_text(json.dumps(result))
          Path('/tmp/lp-board-inspection/geps-dns-listing.html').write_text(html)
          print(json.dumps(result))
          PY
      - name: Collect and replay configured official bodies and offering attachments
        if: ${{ !inputs.geps_dns_probe }}
        env:
          LP_SOURCE_WORKER_TOKEN: ${{ secrets.LP_SOURCE_WORKER_TOKEN }}
        run: |
          mkdir -p /tmp/lp-board-inspection
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from services.lp.src.collect_lp_institution_boards import collect,load_configs
          target=os.environ['LP_INSTITUTION']
          ids={'mmaa','kbiz','geps','kamco','moel_eif','moel_iaci','kfinco'} if target=='remaining' else {target}
          if target=='central_screening':ids={'nh_central','suhyup'}
          configs={k:v for k,v in load_configs(include_pending=True).items() if k in ids}
          assert set(configs)==ids,'Requested official board missing from configuration'
          result=collect(configs)
          Path('/tmp/lp-board-inspection/collection.json').write_text(json.dumps(result,ensure_ascii=False))
          print(json.dumps({'notices':len(result['notices']),'coverage':result['coverage'],'holds':result['holds']},ensure_ascii=False))
          PY
          python3 - <<'PY'
          import json
          import os
          from services.lp.src.collect_lp_institution_boards import validate_notice,load_configs
          report=json.load(open('/tmp/lp-board-inspection/collection.json'))
          assert report['notices'] or os.environ['LP_INSTITUTION'] in {'nh_central','suhyup','central_screening'}, 'No observed official source documents'
          configs=load_configs(include_pending=True)
          for n in report['notices']: validate_notice(n,report['checked_at'],configs[n['institution_id']])
          assert not report['holds'], 'Official source or attachment errors remain'
          print('Validated official bodies:',len(report['notices']))
          PY
      - name: Validate existing selection links and generate complete pages without DB writes
        if: ${{ !inputs.geps_dns_probe && inputs.institution != 'nh_central' && inputs.institution != 'suhyup' && inputs.institution != 'central_screening' }}
        env:
          PYTHONPATH: services/lp/src
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import copy,json,tempfile
          from pathlib import Path
          from lp_notice_publication import publish_basic_notices
          from lp_program_service import validate,build
          from publish_lp_programs import connect,baseline
          from collect_lp_institution_boards import update_catalog
          report=json.load(open('/tmp/lp-board-inspection/collection.json'))
          with connect() as conn:
              conn.execute('SET TRANSACTION READ ONLY')
              data=baseline(conn)
          before=copy.deepcopy(data['programs'])
          data.update(update_catalog(data,report,report['checked_at']))
          assert not data['institution_collection_holds'], 'Official receipt validation failed'
          data['programs'],holds=publish_basic_notices(data,[],report['checked_at'])
          data['as_of']=report['checked_at'][:10]
          for p in data['programs']:
              if p['institution_id']=='kbiz' and p['id'] not in {old['id'] for old in before}:
                  assert not any(p.get(field) for field in ('commitment_amount_krw','manager_count','per_fund_amount_krw')), 'Shared KBIZ allocation was published as PE'
          validate(data)
          after={p['id']:p for p in data['programs']}
          for previous in before:
              assert previous['id'] in after, 'Existing public program missing'
              current=after[previous['id']]
              assert current.get('selected_gps')==previous.get('selected_gps'), 'Existing selection identity changed'
              assert {e['url'] for e in previous['events']} <= {e['url'] for e in current['events']}, 'Existing source URL missing'
              if previous['institution_id'] in {'sema','mmaa','kfinco'}:
                  for field in ('commitment_amount_krw','manager_count','deadline','selected_gps'):
                      if field in previous:
                          assert current.get(field)==previous[field], 'Existing LP public field changed: '+field
          with tempfile.TemporaryDirectory() as folder:
              build(data,Path(folder))
              print('Validated complete LP pages:',len(list(Path(folder).glob('*.html'))))
          Path('/tmp/lp-board-inspection/publication-preflight.json').write_text(json.dumps({
              'program_ids':[p['id'] for p in data['programs']], 'holds':holds,
              'new_programs':[{k:p[k] for k in ('id','institution_id','title','deadline','commitment_amount_krw','manager_count') if k in p} for p in data['programs'] if p['id'] not in {old['id'] for old in before}]},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp-${{ inputs.institution || 'pck_pension' }}-board-verification
          path: /tmp/lp-board-inspection/
          retention-days: 7
          if-no-files-found: error
