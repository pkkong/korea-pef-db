name: Collect LP institution history

# Official board originals since the requested start date, for institutions that
# have a daily board adapter. Review bundle only: no DB write, no program
# projection, no publication. Text bundle -> lp-history-bundles branch;
# attachment bytes -> workflow artifact.
on:
  push:
    branches: [main]
    paths:
      - data/lp_history_collection_request.json
      - .github/workflows/collect-lp-institution-history.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lp-program-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: macos-latest
    timeout-minutes: 330
    env:
      LP_SOURCE_WORKER_TOKEN: ${{ secrets.LP_SOURCE_WORKER_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install document dependencies
        run: python3 -m pip install 'pypdf==6.10.0' 'olefile==0.47' 'truststore==0.10.5'
      - name: Collect official originals
        run: |
          python3 - <<'PY' > /tmp/args
          import json
          r = json.load(open('data/lp_history_collection_request.json'))
          print(','.join(r['institutions']), r['start'], r['end'], r['max_pages'], r['page_budget'], r['max_notices'], r.get('label', 'boards'))
          PY
          read IDS START END MAXP BUDGET MAXN LABEL < /tmp/args
          echo "LABEL=$LABEL" >> "$GITHUB_ENV"
          python3 services/lp/src/collect_lp_institution_history.py --institutions "$IDS" --start "$START" --end "$END" \
            --max-pages "$MAXP" --page-budget "$BUDGET" --max-notices "$MAXN" --out /tmp/lp-history
          cat /tmp/lp-history/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep attachment bytes as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp-history-attachments-${{ env.LABEL }}
          path: /tmp/lp-history/attachments
          retention-days: 90
          if-no-files-found: ignore
      - name: Push text bundle to review branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/lp-history && cd /tmp/lp-history
          rm -rf attachments
          [ -f README.md ] || echo "collection produced no report" > README.md
          echo "${GITHUB_RUN_ID}" > RUN_ID
          BRANCH="lp-history-bundles"; [ "${LABEL:-unlabelled}" = boards ] || BRANCH="lp-history-bundles-${LABEL:-unlabelled}"
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "LP institution history bundles from run ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
