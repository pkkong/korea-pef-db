name: Maintain LP report storage
on:
  workflow_run:
    workflows: [Collect LP programs, Recover LP publication]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect, archive with verified private backups, verify, restore, or reclaim only LP report storage
        type: choice
        options: [inspect, archive, verify, restore, reclaim]
        default: inspect
      limit:
        description: Maximum report batch size
        type: string
        default: '50'
      run_id:
        description: Exact run ID for restoration only
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'lp-report-retention' || 'lp-program-collection' }}
  cancel-in-progress: false
jobs:
  maintain:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       contains(fromJSON('["schedule","workflow_dispatch"]'), github.event.workflow_run.event) &&
       contains(fromJSON('["Collect LP programs","Recover LP publication"]'), github.event.workflow_run.name))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install LP database driver
        run: python3 -m pip install 'psycopg[binary]==3.2.10'
      - name: Test immutable archives and database preservation contracts
        run: python3 -m unittest services.lp.tests.test_lp_report_archive scripts.tests.test_archive_lp_collection_reports scripts.tests.test_lp_report_maintenance_workflow
      - name: Maintain only LP collection report storage
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          LP_MAINTENANCE_MODE: ${{ github.event_name == 'workflow_run' && 'archive' || inputs.mode || 'inspect' }}
          LP_MAINTENANCE_LIMIT: ${{ github.event_name == 'workflow_run' && '5' || inputs.limit || '50' }}
          LP_RESTORE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || '' }}
          LP_MAINTENANCE_AUTOMATIC: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
        run: |
          args=(--mode "$LP_MAINTENANCE_MODE" --limit "$LP_MAINTENANCE_LIMIT" --output /tmp/lp-report-maintenance/result.json)
          if [ "$LP_MAINTENANCE_AUTOMATIC" = true ]; then
            args+=(--reuse-space)
          fi
          if [ -n "$LP_RESTORE_RUN_ID" ]; then
            args+=(--run-id "$LP_RESTORE_RUN_ID")
          fi
          python3 scripts/archive_lp_collection_reports.py "${args[@]}"
      - name: Verify published pages remain available and unchanged
        run: |
          python3 - <<'PY'
          import json,urllib.request
          from pathlib import Path
          report=json.loads(Path('/tmp/lp-report-maintenance/result.json').read_text())
          snapshot=report.get('after') or report
          published=snapshot.get('published')
          if published:
              names=[name for name in published['page_names'] if name.startswith('program-')]+['index.html']
              for name in names:
                  with urllib.request.urlopen('https://kpef-lp.vercel.app/'+name,timeout=30) as response:
                      assert response.status==200
                      assert response.headers.get('X-LP-Run')==published['run_id']
                      assert response.headers.get('X-LP-Data-Source')=='supabase'
              print('Verified public LP pages:',len(names),published['run_id'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp-report-maintenance
          path: /tmp/lp-report-maintenance/
          retention-days: 7
          if-no-files-found: warn
