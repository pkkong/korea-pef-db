name: Sync newsletter Supabase read model

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date in YYYY-MM-DD. Leave blank for today's date in Asia/Seoul."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: newsletter-supabase-sync
  cancel-in-progress: false

env:
  NEWSLETTER_PUBLIC_URL: https://pkkong.github.io/kpef-newsletter
  NEWSLETTER_APP_URL: https://kpef-newsletter.vercel.app

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Resolve requested report date
        id: requested_date
        shell: bash
        env:
          REQUESTED_REPORT_DATE: ${{ github.event.inputs.report_date || '' }}
        run: |
          echo "report_date=${REQUESTED_REPORT_DATE:-}" >> "$GITHUB_OUTPUT"

      - name: Download verified Pages mirror archive
        id: archive
        shell: bash
        run: |
          mkdir -p exports/daily_news
          python3 services/newsletter/src/newsletter_public_status.py download-verified-archive \
            --requested-report-date "${{ steps.requested_date.outputs.report_date }}" \
            --mirror-url "${NEWSLETTER_PUBLIC_URL}" \
            --out exports/daily_news/public_archive.json

      - name: Sync Supabase newsletter read model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are required."
            exit 1
          fi
          python3 services/newsletter/src/sync_newsletter_supabase.py \
            --archive exports/daily_news/public_archive.json \
            --payload-out exports/daily_news/newsletter_supabase_payload.json \
            --apply

      - name: Verify Vercel newsletter app
        shell: bash
        run: |
          python3 services/newsletter/src/newsletter_public_status.py verify-vercel-app \
            --report-date "${{ steps.archive.outputs.report_date }}" \
            --app-url "${NEWSLETTER_APP_URL}" \
            --mirror-url "${NEWSLETTER_PUBLIC_URL}"
