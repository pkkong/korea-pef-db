name: Sync newsletter Supabase read model

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date in YYYY-MM-DD. Leave blank for today's date in Asia/Seoul."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: newsletter-supabase-sync
  cancel-in-progress: false

env:
  NEWSLETTER_PUBLIC_URL: https://pkkong.github.io/kpef-newsletter
  NEWSLETTER_APP_URL: https://kpef-newsletter.vercel.app

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Resolve report date
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.report_date }}" ]; then
            echo "report_date=${{ inputs.report_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "report_date=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified public archive
        shell: bash
        run: |
          mkdir -p exports/daily_news
          python3 - "${{ steps.date.outputs.report_date }}" "${NEWSLETTER_PUBLIC_URL}" <<'PY'
          import json
          import sys
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          report_date = sys.argv[1]
          base_url = sys.argv[2].rstrip("/")

          def fetch_json(path: str):
              req = Request(
                  f"{base_url}/{path}?sync={int(time.time())}-{report_date}",
                  headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
              )
              with urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          health = fetch_json("health.json")
          archive = fetch_json("archive.json")
          if health.get("report_date") != report_date:
              raise SystemExit(f"mirror report_date={health.get('report_date')} expected={report_date}")
          article_count = int(health.get("article_count") or 0)
          entry = next(
              (row for row in archive if isinstance(row, dict) and row.get("reportDate") == report_date),
              None,
          )
          archive_count = len(entry.get("articles") or []) if isinstance(entry, dict) else 0
          if article_count <= 0 or archive_count != article_count:
              raise SystemExit(
                  f"mirror archive is not syncable: health={article_count} archive={archive_count}"
              )
          out = Path("exports/daily_news/public_archive.json")
          out.write_text(json.dumps(archive, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"public_archive=ok report_date={report_date} articles={article_count}")
          PY

      - name: Sync Supabase newsletter read model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are required."
            exit 1
          fi
          python3 services/newsletter/src/sync_newsletter_supabase.py \
            --archive exports/daily_news/public_archive.json \
            --payload-out exports/daily_news/newsletter_supabase_payload.json \
            --apply

      - name: Verify Vercel newsletter app
        shell: bash
        run: |
          python3 - "${{ steps.date.outputs.report_date }}" "${NEWSLETTER_APP_URL}" "${NEWSLETTER_PUBLIC_URL}" <<'PY'
          import json
          import sys
          import time
          from urllib.request import Request, urlopen

          report_date = sys.argv[1]
          app_base_url = sys.argv[2].rstrip("/")
          mirror_base_url = sys.argv[3].rstrip("/")

          def fetch_json(url: str):
              req = Request(
                  f"{url}{'&' if '?' in url else '?'}verify={int(time.time())}-{report_date}",
                  headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
              )
              with urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          mirror_health = fetch_json(f"{mirror_base_url}/health.json")
          expected_article_count = int(mirror_health.get("article_count") or 0)
          deadline = time.time() + 180
          last_error = ""
          while time.time() <= deadline:
              try:
                  health = fetch_json(f"{app_base_url}/health.json?refresh=1")
                  archive = fetch_json(f"{app_base_url}/archive.json?refresh=1")
                  if health.get("report_date") != report_date:
                      raise RuntimeError(f"app report_date={health.get('report_date')} expected={report_date}")
                  if health.get("data_source") != "supabase":
                      raise RuntimeError(f"app data_source={health.get('data_source')} expected=supabase")
                  article_count = int(health.get("article_count") or 0)
                  if article_count != expected_article_count:
                      raise RuntimeError(f"app article_count={article_count} expected={expected_article_count}")
                  entry = next(
                      (row for row in archive if isinstance(row, dict) and row.get("reportDate") == report_date),
                      None,
                  )
                  archive_count = len(entry.get("articles") or []) if isinstance(entry, dict) else 0
                  if archive_count != expected_article_count:
                      raise RuntimeError(f"app archive_count={archive_count} expected={expected_article_count}")
                  print(
                      "supabase_recovery_verify_status=ok "
                      f"report_date={report_date} articles={article_count}"
                  )
                  raise SystemExit(0)
              except Exception as exc:
                  last_error = str(exc)
                  print(f"supabase_recovery_verify_wait={last_error}")
                  time.sleep(10)

          raise SystemExit(f"Vercel verification failed after Supabase sync: {last_error}")
          PY
