name: Collect LP logo candidates

# Gathers official logo/CI candidates for LP institutions into the
# lp-logo-candidates branch for review. Publishes nothing.
on:
  push:
    branches: [main]
    paths:
      - scripts/collect_lp_logo_candidates.py
      - .github/workflows/collect-lp-logo-candidates.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lp-logo-candidates
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect candidates
        run: python3 scripts/collect_lp_logo_candidates.py --out /tmp/lp-logos
      - name: Push candidates to review branch
        shell: bash
        run: |
          cd /tmp/lp-logos
          git init -q -b lp-logo-candidates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "LP logo candidates from run ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" lp-logo-candidates
