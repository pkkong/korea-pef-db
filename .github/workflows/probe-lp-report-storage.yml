name: Probe LP report storage in isolated PostgreSQL
on:
  workflow_dispatch:
    inputs:
      collection_run:
        description: Recent completed main Collect LP programs run
        required: true
        type: string
      recovery_run:
        description: Completed main recovery with the same retained input evidence
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: lp-program-collection
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lp_probe
          POSTGRES_PASSWORD: lp_probe
          POSTGRES_DB: lp_report_probe
        ports:
          - 5432:5432
        options: >-
          --memory=512m
          --health-cmd "pg_isready -U lp_probe -d lp_report_probe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Initialize metadata-only output
        run: |
          mkdir -p /tmp/lp-report-probe-output /tmp/lp-report-probe-input
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/lp-report-probe-output/probe.json').write_text(json.dumps({
              'kind':'lp_report_storage_probe_v1','success':False,'stage':'workflow_setup',
              'production_database_connections':0,'official_http_requests':0,'published':False}))
          PY
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify both main-run producers before downloading inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COLLECTION_RUN: ${{ inputs.collection_run }}
          RECOVERY_RUN: ${{ inputs.recovery_run }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          from services.lp.src.probe_lp_report_storage import validate_provenance
          runs=[]
          for name in ('COLLECTION_RUN','RECOVERY_RUN'):
              ident=os.environ[name]
              if not re.fullmatch('[1-9][0-9]*',ident):raise ValueError('Numeric Actions run required')
              runs.append(json.loads(subprocess.check_output([
                  'gh','api',f"repos/{os.environ['GH_REPO']}/actions/runs/{ident}"])))
          proof=validate_provenance(*runs,os.environ['GH_REPO'])
          Path('/tmp/lp-report-probe-output/provenance.json').write_text(json.dumps(proof))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: kgrowth-collection
          run-id: ${{ inputs.collection_run }}
          github-token: ${{ github.token }}
          path: /tmp/lp-report-probe-input/original
      - uses: actions/download-artifact@v4
        with:
          name: lp-publication-recovery
          run-id: ${{ inputs.recovery_run }}
          github-token: ${{ github.token }}
          path: /tmp/lp-report-probe-input/recovery
      - name: Install local database driver only
        run: python3 -m pip install 'psycopg[binary]==3.2.10'
      - name: Verify local-only safety and report-storage contracts
        run: python3 -m unittest services.lp.tests.test_probe_lp_report_storage -q
      - name: Replay the unchanged report INSERT on the isolated database
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          memory_bytes=$(docker inspect --format '{{.HostConfig.Memory}}' "$POSTGRES_CONTAINER_ID")
          test "$memory_bytes" = '536870912'
          timeout --signal=TERM --kill-after=10s 420s python3 services/lp/src/probe_lp_report_storage.py \
            --original-dir /tmp/lp-report-probe-input/original \
            --recovery-dir /tmp/lp-report-probe-input/recovery \
            --output-dir /tmp/lp-report-probe-output \
            --container-memory-limit "$memory_bytes"
      - name: Retain only isolated container memory counters
        if: always()
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          result={'environment_only':True,'production_oom_inference':False}
          container=os.environ.get('POSTGRES_CONTAINER_ID','')
          try:
              fields=subprocess.check_output(['docker','inspect','--format',
                  '{{json .HostConfig.Memory}} {{json .State.OOMKilled}} {{json .State.Running}} {{json .State.ExitCode}}',container],
                  stderr=subprocess.DEVNULL,timeout=10).decode().split()
              if len(fields)!=4:raise ValueError('Unexpected container state')
              result.update(zip(('memory_limit_bytes','oom_killed','running','exit_code'),map(json.loads,fields)))
          except Exception as error:result['inspect_error_type']=type(error).__name__
          try:
              value=subprocess.run(['docker','exec',container,'cat','/sys/fs/cgroup/memory.events'],
                  capture_output=True,timeout=10)
              if value.returncode!=0 or len(value.stdout)>4096:raise ValueError('Memory counters unavailable')
              counters={}
              for line in value.stdout.decode().splitlines():
                  key,count=line.split()
                  if key in {'low','high','max','oom','oom_kill','oom_group_kill'} and count.isdecimal():counters[key]=int(count)
              result['memory_events']=counters
          except Exception as error:result['memory_events_error_type']=type(error).__name__
          Path('/tmp/lp-report-probe-output/container.json').write_text(json.dumps(result))
          PY
      - name: Keep an explicit signal if the process did not finish
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('/tmp/lp-report-probe-output/probe.json')
          value=json.loads(path.read_text())
          if not value.get('success') and not value.get('error_type'):
              value['error_type']='ProbeDidNotComplete'
              path.write_text(json.dumps(value))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp-report-storage-probe
          path: |
            /tmp/lp-report-probe-output/probe.json
            /tmp/lp-report-probe-output/provenance.json
            /tmp/lp-report-probe-output/container.json
          retention-days: 14
          if-no-files-found: error
