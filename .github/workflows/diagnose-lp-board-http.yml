name: Diagnose LP official HTTP responses
on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, macos-latest]
      institution:
        type: choice
        default: cu
        options: [cu, kfcc, kfinco, tp, all]
      verify_cu_recovery:
        type: boolean
        default: false
      verify_institution_boards:
        type: boolean
        default: false
      verify_tp_collection:
        type: boolean
        default: false
      verify_dns_recovery:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lp-program-collection
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compare bounded anonymous official requests
        shell: python3 {0}
        env:
          DIAGNOSE_INSTITUTION: ${{ inputs.institution }}
        run: |
          import hashlib, json, os, re, socket, subprocess, sys, tempfile, time
          from html.parser import HTMLParser
          from http.cookiejar import CookieJar
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote, urlsplit
          from urllib.request import Request, HTTPCookieProcessor, build_opener
          class PublicTPForm(HTMLParser):
            allowed={'searchCondition','pageItm','pageIndex','searchKeyword'}
            def __init__(self):
              super().__init__(convert_charrefs=True)
              self.fields={};self.select=None;self.option=None
            def handle_starttag(self,tag,attrs):
              attrs=dict(attrs);name=attrs.get('name')
              if tag=='input' and name in self.allowed:
                self.fields.setdefault(name,[]).append({'kind':'input','value':attrs.get('value','')[:300]})
              elif tag=='select':
                self.select=None;self.option=None
                if name in self.allowed:
                  self.select={'kind':'select','options':[],'values':[]}
                  self.fields.setdefault(name,[]).append(self.select)
              elif tag=='option' and self.select is not None:
                self.option={'value':attrs.get('value','')[:100],'label':'','selected':'selected' in attrs}
                self.select['options'].append(self.option)
            def handle_data(self,data):
              if self.option is not None:self.option['label']=(self.option['label']+data).strip()[:100]
            def handle_endtag(self,tag):
              if tag=='option':self.option=None
              elif tag=='select':
                if self.select is not None:
                  options=self.select['options']
                  self.select['values']=[o['value'] for o in options if o['selected']] or [o['value'] for o in options[:1]]
                self.select=None;self.option=None
          def tp_board_metadata(raw,url,index,final_url):
            parsed=urlsplit(final_url)
            if parsed.scheme!='https' or parsed.hostname!='www.tp.or.kr' or parsed.path!='/tp-kr/bbs/i-151/list.do':
              raise ValueError('TP board response changed official route')
            if len(raw)>12582912 or b'<html' not in raw.lower():raise ValueError('TP board response is oversized or not HTML')
            digest=hashlib.sha256(raw).hexdigest()
            folder=Path('/tmp/tp-http-diagnostic');folder.mkdir(exist_ok=True)
            destination=folder/(str(index).zfill(2)+'-'+digest[:16]+'.html')
            destination.write_bytes(raw)
            html=raw.decode('utf-8','replace');form=PublicTPForm();form.feed(html)
            metadata={'institution':'tp','mode':'public_board_metadata','url':url,'form_fields':form.fields,'artifact':destination.name}
            try:
              sys.path.insert(0,str(Path.cwd()))
              from services.lp.src.lp_board_adapters_pensions import parse_listing
              from services.lp.src.collect_lp_institution_boards import load_configs
              rows=parse_listing(html,url,load_configs()['tp'])
              metadata['row_count']=len(rows)
              metadata['rows']=[{'title':r['title'][:300],'date':r['date']} for r in rows[:100]]
            except Exception as error:metadata['row_parse_error']=type(error).__name__
            print(json.dumps(metadata,ensure_ascii=False))
          targets = [
            ('cu', 'https://www.cu.co.kr/cu/na/ntt/selectNttList.do?bbsId=1020&mi=100007&searchType=sj&listCo=50&searchValue='+quote('블라인드')+'&currPage=1', 'https://www.cu.co.kr/cu/na/ntt/selectNttList.do?bbsId=1020&mi=100007'),
            ('kfcc', 'https://www.kfcc.co.kr/mgNotice/mgNoticeList.do?schType=subject&schValue='+quote('위탁')+'&pageNo=1', 'https://www.kfcc.co.kr/mgNotice/mgNoticeList.do?schType=subject'),
            ('kfinco', 'https://www.kfinco.co.kr/api/pr/notice/list?page=1&size=10&searchKeyword='+quote('위탁운용사'), 'https://www.kfinco.co.kr/pr/notice'),
            ('tp', 'https://www.tp.or.kr/tp-kr/bbs/i-151/list.do?searchCondition=1&pageItm=100&searchKeyword='+quote('위탁운용사')+'&pageIndex=1', 'https://www.tp.or.kr/tp-kr/bbs/i-151/list.do?searchCondition=1&pageItm=100')]
          for institution,url,referer in targets:
            if os.environ['DIAGNOSE_INSTITUTION'] not in {institution,'all'}:continue
            host=urlsplit(url).hostname
            for family in [socket.AF_UNSPEC,socket.AF_INET,socket.AF_INET6]:
              started=time.monotonic()
              try:
                addresses=sorted({a[4][0] for a in socket.getaddrinfo(host,443,family,socket.SOCK_STREAM)})
                print(json.dumps({'institution':institution,'resolver_family':family.name,'addresses':addresses,'seconds':round(time.monotonic()-started,3)}))
              except OSError as error:print(json.dumps({'institution':institution,'resolver_family':family.name,'errno':error.errno,'error':str(error),'seconds':round(time.monotonic()-started,3)}))
            if institution=='tp':
              tp_board='https://www.tp.or.kr/tp-kr/bbs/i-151/list.do'
              probes=[tp_board,'https://www.tp.or.kr/',
                tp_board+'?searchCondition=1',tp_board+'?pageItm=100',
                tp_board+'?searchKeyword='+quote('위탁운용사')+'&pageIndex=1',
                tp_board+'?searchCondition=1&pageItm=10&searchKeyword='+quote('위탁운용사')+'&pageIndex=1']
              for probe_index,probe_url in enumerate(probes):
                try:
                  try:
                    with build_opener().open(Request(probe_url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as response:
                      probe_raw=response.read(12582913);probe_status=response.status;probe_final_url=response.geturl()
                  except HTTPError as error:
                    probe_status=error.code;probe_raw=error.read(4096)
                  print(json.dumps({'institution':institution,'mode':'bare_official_page','url':probe_url,
                    'status':probe_status,'size':len(probe_raw),'sha256':hashlib.sha256(probe_raw).hexdigest(),
                    'text_excerpt':re.sub(r'\s+',' ',re.sub(r'<[^>]*>',' ',probe_raw.decode('utf-8','replace')))[:400] if probe_status!=200 else None},ensure_ascii=False))
                  if probe_status==200 and urlsplit(probe_url).path=='/tp-kr/bbs/i-151/list.do':
                    tp_board_metadata(probe_raw,probe_url,probe_index,probe_final_url)
                except Exception as error:print(json.dumps({'institution':institution,'mode':'bare_official_page','url':probe_url,'error':str(error)}))
            modes=['collector','curl_h1','curl_ipv4'] if institution=='cu' else ['collector','browser','warm_session','curl_h1']
            for mode in modes:
              headers={'User-Agent': 'Mozilla/5.0 (LP official board collector)' if mode=='collector' else 'Mozilla/5.0', 'Accept-Encoding':'identity','Connection':'close','Referer':referer}
              try:
                if mode.startswith('curl_'):
                  with tempfile.TemporaryDirectory() as folder:
                    path=Path(folder)/'body'
                    args=['curl','--http1.1','--fail-with-body','--max-time','20','--max-filesize','12582912','--silent','--show-error','--output',str(path),'--write-out','%{http_code}']
                    if mode=='curl_ipv4':args+=['--ipv4']
                    for key,value in headers.items():args+=['-H',key+': '+value]
                    result=subprocess.run(args+[url],capture_output=True,text=True,timeout=25)
                    raw=path.read_bytes() if path.exists() else b''
                    status=result.stdout
                    print(json.dumps({'institution':institution,'mode':mode,'curl_exit':result.returncode,'curl_error':result.stderr[:240]}))
                else:
                  opener=build_opener(HTTPCookieProcessor(CookieJar()))
                  if mode=='warm_session':
                    if institution=='tp':
                      # One ordinary board read distinguishes a board-wide HTTP
                      # failure from the configured title-search response.
                      try:
                        with opener.open(Request(referer,headers=headers),timeout=20) as response:
                          default_raw=response.read(12582913);default_status=response.status
                      except HTTPError as error:
                        default_status=error.code;default_raw=error.read(4096)
                      print(json.dumps({'institution':institution,'mode':'warm_default_page','url':referer,
                        'status':default_status,'size':len(default_raw),'sha256':hashlib.sha256(default_raw).hexdigest(),
                        'error_excerpt':default_raw[:240].decode('utf-8','replace') if default_status!=200 else None},ensure_ascii=False))
                    else:
                      with opener.open(Request(referer,headers=headers),timeout=20) as response:response.read(12582913)
                  try:
                    with opener.open(Request(url,headers=headers),timeout=20) as response:raw=response.read(12582913);status=response.status
                  except HTTPError as error:status=error.code;raw=error.read(4096)
                print(json.dumps({'institution':institution,'mode':mode,'status':status,'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'error_excerpt':raw[:240].decode('utf-8','replace') if str(status)!='200' else None},ensure_ascii=False))
              except Exception as error:print(json.dumps({'institution':institution,'mode':mode,'error':str(error)}))
      - name: Install native TLS verifier for K-FINCO diagnosis
        if: inputs.institution == 'kfinco' || inputs.institution == 'all'
        run: python3 -m pip install 'truststore==0.10.5'
      - name: Compare bounded K-FINCO API requests with native TLS
        if: inputs.institution == 'kfinco' || inputs.institution == 'all'
        shell: python3 {0}
        run: |
          import hashlib, json, re, ssl
          from html.parser import HTMLParser
          from http.cookiejar import CookieJar
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote, urljoin, urlsplit
          from urllib.request import Request, HTTPRedirectHandler, HTTPSHandler, HTTPCookieProcessor, ProxyHandler, build_opener
          import truststore
          BASE='https://www.kfinco.co.kr'
          PAGE=BASE+'/pr/notice'
          ROOT=BASE+'/'
          API=BASE+'/api/pr/notice/list?page=1&size=10'
          EXACT=API+'&searchKeyword='+quote('위탁운용사',safe='')
          SHORT=API+'&searchKeyword='+quote('위탁',safe='')
          APEX='https://kfinco.co.kr/api/pr/notice/list?page=1&size=10&searchKeyword='+quote('위탁운용사',safe='')
          ALLOWED={PAGE,ROOT,API,EXACT,SHORT,APEX}
          LIMIT=2*1024*1024
          folder=Path('/tmp/kfinco-http-diagnostic');folder.mkdir(exist_ok=True)
          def check_url(url):
            p=urlsplit(url)
            if url not in ALLOWED or p.scheme!='https' or p.hostname not in {'www.kfinco.co.kr','kfinco.co.kr'} or p.port is not None or p.username or p.password or p.fragment:
              raise ValueError('Unexpected diagnostic official URL')
          class NoRedirect(HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl):
              raise ValueError('Diagnostic redirect refused; fixed official GET requests only')
          class VisibleText(HTMLParser):
            def __init__(self):
              super().__init__(convert_charrefs=True);self.hidden=0;self.parts=[];self.scripts=[]
            def handle_starttag(self,tag,attrs):
              attrs=dict(attrs)
              if tag=='script' and attrs.get('src') and len(self.scripts)<20:self.scripts.append(attrs['src'])
              if tag in {'script','style'}:self.hidden+=1
            def handle_endtag(self,tag):
              if tag in {'script','style'} and self.hidden:self.hidden-=1
            def handle_data(self,data):
              if not self.hidden:self.parts.append(data)
          def opener():
            context=truststore.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
            context.verify_mode=ssl.CERT_REQUIRED;context.check_hostname=True
            if context.verify_mode!=ssl.CERT_REQUIRED or not context.check_hostname:raise ValueError('TLS verification is required')
            return build_opener(ProxyHandler({}),NoRedirect(),HTTPSHandler(context=context),HTTPCookieProcessor(CookieJar()))
          def probe(mode,url,headers,session):
            check_url(url)
            record={'institution':'kfinco','mode':mode,'url':url}
            try:
              try:
                with session.open(Request(url,headers=headers,method='GET'),timeout=20) as response:
                  check_url(response.geturl());status=response.status;raw=response.read(LIMIT+1)
                  if len(raw)>LIMIT:raise ValueError('Diagnostic response exceeds 2 MB')
                  content_type=response.headers.get('Content-Type','')
              except HTTPError as error:
                status=error.code;raw=error.read(4096);content_type=error.headers.get('Content-Type','')
              text=raw.decode('utf-8','replace');parsed=VisibleText();parsed.feed(text)
              record.update({'status':status,'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),
                'text_excerpt':re.sub(r'\s+',' ',' '.join(parsed.parts)).strip()[:1500] if status!=200 else None})
              is_html='html' in content_type.lower() or bool(re.search(r'<(?:!doctype|html)',text,re.I))
              is_json='json' in content_type.lower() or text.lstrip().startswith(('{','['))
              if is_html or is_json:
                destination=folder/(mode+('.html' if is_html else '.json'));destination.write_bytes(raw)
                record['artifact']=destination.name
              if url in {PAGE,ROOT} and status==200:
                record['script_src_urls']=[urljoin(url,src) for src in parsed.scripts[:20]]
              print(json.dumps(record,ensure_ascii=False),flush=True)
            except Exception as error:
              record['error']=str(error)[:500];print(json.dumps(record,ensure_ascii=False),flush=True)
          production={'User-Agent':'Mozilla/5.0 (LP original notice collector)','Accept-Encoding':'identity','Connection':'close'}
          browser={'User-Agent':'Mozilla/5.0','Accept':'application/json','Accept-Encoding':'identity','Connection':'close','Referer':PAGE}
          probe('native_production',EXACT,production,opener())
          warmed=opener()
          probe('native_warm_page',PAGE,{'User-Agent':'Mozilla/5.0','Accept':'text/html','Accept-Encoding':'identity','Connection':'close'},warmed)
          probe('native_browser_warmed',EXACT,browser,warmed)
          probe('native_no_keyword',API,production,opener())
          probe('native_short_keyword',SHORT,production,opener())
          root_warmed=opener()
          probe('native_root_page',ROOT,{'User-Agent':'Mozilla/5.0','Accept':'text/html','Accept-Encoding':'identity','Connection':'close'},root_warmed)
          probe('native_root_warmed',EXACT,{**browser,'Referer':ROOT},root_warmed)
          probe('native_apex_production',APEX,production,opener())
      - name: Inspect served K-FINCO public certificate chain
        if: inputs.institution == 'kfinco' || inputs.institution == 'all'
        shell: python3 {0}
        run: |
          import hashlib, json, re, subprocess
          from pathlib import Path
          folder=Path('/tmp/kfinco-http-diagnostic');folder.mkdir(exist_ok=True)
          result=subprocess.run(['openssl','s_client','-connect','www.kfinco.co.kr:443','-servername','www.kfinco.co.kr',
            '-showcerts','-verify_return_error','-verify_hostname','www.kfinco.co.kr'],input='',capture_output=True,text=True,timeout=25)
          certificates=re.findall(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----',result.stdout,re.S)
          print(json.dumps({'mode':'strict public certificate inspection; no HTTP request','exit':result.returncode,'served_certificates':len(certificates),
            'verification_excerpt':result.stderr[-1000:]}))
          for index,pem in enumerate(certificates):
            path=folder/('served-chain-'+str(index)+'.pem');path.write_text(pem+'\n')
            info=subprocess.run(['openssl','x509','-in',str(path),'-noout','-text'],capture_output=True,text=True,timeout=5)
            lines=info.stdout.splitlines()
            metadata=[line.strip() for line in lines if any(key in line for key in ['Issuer:','Subject:','CA Issuers - URI:','Not Before:','Not After :'])]
            print(json.dumps({'mode':'public certificate metadata','index':index,'sha256':hashlib.sha256(pem.encode()).hexdigest(),'metadata':metadata}))
      - name: Keep public K-FINCO diagnostic HTML and JSON
        if: always() && (inputs.institution == 'kfinco' || inputs.institution == 'all')
        uses: actions/upload-artifact@v4
        with:
          name: kfinco-http-diagnostic
          path: /tmp/kfinco-http-diagnostic/
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep successful public TP board HTML
        if: always() && (inputs.institution == 'tp' || inputs.institution == 'all')
        uses: actions/upload-artifact@v4
        with:
          name: tp-http-diagnostic
          path: /tmp/tp-http-diagnostic/*.html
          retention-days: 7
          if-no-files-found: ignore
      - name: Install readers for explicit CU recovery verification
        if: inputs.verify_cu_recovery || inputs.verify_institution_boards || inputs.verify_dns_recovery || inputs.verify_tp_collection
        run: python3 -m pip install 'pypdf==6.10.0' 'olefile==0.47'
      - name: Verify injected DNS failure with real official CU documents
        if: inputs.verify_cu_recovery
        run: |
          python3 - <<'PY'
          import json, socket
          from unittest.mock import Mock
          from urllib.error import URLError
          from services.lp.src.collect_lp_institution_boards import Session, collect, load_configs, validate_notice
          def injected_session(config):
            session=Session(config)
            session.opener.open=Mock(side_effect=URLError(socket.gaierror(8,'injected resolver failure')))
            return session
          report=collect({'cu':load_configs()['cu']},fetch_factory=injected_session)
          for notice in report['notices']:validate_notice(notice,report['checked_at'])
          print(json.dumps({'mode':'injected DNS failure; real official HTTPS bytes; no DB writes',
            'coverage':report['coverage'],'holds':report['holds'],'validated_notices':len(report['notices'])},ensure_ascii=False))
          assert not report['holds'], 'CU recovery failed'
          assert report['notices'], 'CU recovery did not find official documents'
          assert report['coverage']['cu']['native_ipv4_fetch_count']>0
          PY
      - name: Verify only configured TP collection without publication
        if: inputs.verify_tp_collection
        run: |
          python3 - <<'PY'
          import json
          from services.lp.src.collect_lp_institution_boards import collect, load_configs, validate_notice
          report=collect({'tp':load_configs()['tp']})
          for notice in report['notices']:validate_notice(notice,report['checked_at'])
          outages=[h for h in report['holds'] if h['stage'] in {'institution_listing','institution_detail','institution_depth'}]
          print(json.dumps({'mode':'TP only; real official requests; no injected errors; no DB writes',
            'coverage':report['coverage'],'holds':report['holds'],'validated_notices':len(report['notices'])},ensure_ascii=False))
          assert not outages, 'TP official collection failed'
          assert report['notices'], 'TP official collection found no documents'
          PY
      - name: Verify real configured institution boards without publication
        if: inputs.verify_institution_boards
        env:
          LP_SOURCE_WORKER_TOKEN: ${{ secrets.LP_SOURCE_WORKER_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          from services.lp.src.collect_lp_institution_boards import collect, validate_notice
          report=collect()
          for notice in report['notices']:validate_notice(notice,report['checked_at'])
          outages=[h for h in report['holds'] if h['stage'] in {'institution_listing','institution_detail','institution_depth'}]
          print(json.dumps({'mode':'real official requests; no injected errors; no DB writes',
            'coverage':report['coverage'],'holds':report['holds'],'validated_notices':len(report['notices'])},ensure_ascii=False))
          assert not outages, 'Official institution collection failed'
          PY
      - name: Verify injected DNS recovery across configured official boards
        if: inputs.verify_dns_recovery
        env:
          LP_SOURCE_WORKER_TOKEN: ${{ secrets.LP_SOURCE_WORKER_TOKEN }}
          DIAGNOSE_INSTITUTION: ${{ inputs.institution }}
        run: |
          python3 -u - <<'PY'
          import json, os, socket
          from unittest.mock import Mock
          from urllib.error import URLError
          from services.lp.src.collect_lp_institution_boards import Session, collect, load_configs, validate_notice
          def injected_session(config):
            session=Session(config)
            session.opener.open=Mock(side_effect=URLError(socket.gaierror(8,'injected resolver failure')))
            return session
          outages=[]
          for identity,config in load_configs().items():
            if os.environ['DIAGNOSE_INSTITUTION'] not in {identity,'all'}:continue
            report=collect({identity:config},fetch_factory=injected_session)
            for notice in report['notices']:validate_notice(notice,report['checked_at'])
            outages.extend(h for h in report['holds'] if h['stage'] in {'institution_listing','institution_detail','institution_depth'})
            print(json.dumps({'mode':'injected DNS failure; real official HTTPS bytes; no DB writes',
              'institution':identity,'coverage':report['coverage'],'holds':report['holds'],
              'validated_notices':len(report['notices'])},ensure_ascii=False),flush=True)
          assert not outages, 'Official institution DNS recovery failed'
          PY
