name: Diagnose LP official HTTP responses
on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, macos-latest]
      institution:
        type: choice
        default: cu
        options: [cu, kfcc, kfinco, tp, kexim, all]
      verify_kexim_result:
        type: boolean
        default: false
      kexim_result_stage:
        description: Automatically choose a retained final result or a matching pending screening stage
        type: choice
        default: final
        options: [final, screening]
      kexim_listing_run:
        type: string
        required: false
      kexim_collection_run:
        type: string
        required: false
      verify_kdb_dns_recovery:
        type: boolean
        default: false
      verify_cu_regional_recovery:
        type: boolean
        default: false
      verify_cu_recovery:
        type: boolean
        default: false
      verify_institution_boards:
        type: boolean
        default: false
      verify_tp_collection:
        type: boolean
        default: false
      verify_dns_recovery:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lp-program-collection
  cancel-in-progress: false
jobs:
  diagnose:
    if: inputs.institution != 'kexim'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compare bounded anonymous official requests
        if: ${{ !inputs.verify_cu_regional_recovery && !inputs.verify_kdb_dns_recovery }}
        shell: python3 {0}
        env:
          DIAGNOSE_INSTITUTION: ${{ inputs.institution }}
        run: |
          import hashlib, json, os, re, socket, subprocess, sys, tempfile, time
          from html.parser import HTMLParser
          from http.cookiejar import CookieJar
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote, urlsplit
          from urllib.request import Request, HTTPCookieProcessor, build_opener
          class PublicTPForm(HTMLParser):
            allowed={'searchCondition','pageItm','pageIndex','searchKeyword'}
            def __init__(self):
              super().__init__(convert_charrefs=True)
              self.fields={};self.select=None;self.option=None
            def handle_starttag(self,tag,attrs):
              attrs=dict(attrs);name=attrs.get('name')
              if tag=='input' and name in self.allowed:
                self.fields.setdefault(name,[]).append({'kind':'input','value':attrs.get('value','')[:300]})
              elif tag=='select':
                self.select=None;self.option=None
                if name in self.allowed:
                  self.select={'kind':'select','options':[],'values':[]}
                  self.fields.setdefault(name,[]).append(self.select)
              elif tag=='option' and self.select is not None:
                self.option={'value':attrs.get('value','')[:100],'label':'','selected':'selected' in attrs}
                self.select['options'].append(self.option)
            def handle_data(self,data):
              if self.option is not None:self.option['label']=(self.option['label']+data).strip()[:100]
            def handle_endtag(self,tag):
              if tag=='option':self.option=None
              elif tag=='select':
                if self.select is not None:
                  options=self.select['options']
                  self.select['values']=[o['value'] for o in options if o['selected']] or [o['value'] for o in options[:1]]
                self.select=None;self.option=None
          def tp_board_metadata(raw,url,index,final_url):
            parsed=urlsplit(final_url)
            if parsed.scheme!='https' or parsed.hostname!='www.tp.or.kr' or parsed.path!='/tp-kr/bbs/i-151/list.do':
              raise ValueError('TP board response changed official route')
            if len(raw)>12582912 or b'<html' not in raw.lower():raise ValueError('TP board response is oversized or not HTML')
            digest=hashlib.sha256(raw).hexdigest()
            folder=Path('/tmp/tp-http-diagnostic');folder.mkdir(exist_ok=True)
            destination=folder/(str(index).zfill(2)+'-'+digest[:16]+'.html')
            destination.write_bytes(raw)
            html=raw.decode('utf-8','replace');form=PublicTPForm();form.feed(html)
            metadata={'institution':'tp','mode':'public_board_metadata','url':url,'form_fields':form.fields,'artifact':destination.name}
            try:
              sys.path.insert(0,str(Path.cwd()))
              from services.lp.src.lp_board_adapters_pensions import parse_listing
              from services.lp.src.collect_lp_institution_boards import load_configs
              rows=parse_listing(html,url,load_configs()['tp'])
              metadata['row_count']=len(rows)
              metadata['rows']=[{'title':r['title'][:300],'date':r['date']} for r in rows[:100]]
            except Exception as error:metadata['row_parse_error']=type(error).__name__
            print(json.dumps(metadata,ensure_ascii=False))
          targets = [
            ('cu', 'https://www.cu.co.kr/cu/na/ntt/selectNttList.do?bbsId=1020&mi=100007&searchType=sj&listCo=50&searchValue='+quote('블라인드')+'&currPage=1', 'https://www.cu.co.kr/cu/na/ntt/selectNttList.do?bbsId=1020&mi=100007'),
            ('kfcc', 'https://www.kfcc.co.kr/mgNotice/mgNoticeList.do?schType=subject&schValue='+quote('위탁')+'&pageNo=1', 'https://www.kfcc.co.kr/mgNotice/mgNoticeList.do?schType=subject'),
            ('kfinco', 'https://www.kfinco.co.kr/api/pr/notice/list?page=1&size=10&searchKeyword='+quote('위탁운용사'), 'https://www.kfinco.co.kr/pr/notice'),
            ('tp', 'https://www.tp.or.kr/tp-kr/bbs/i-151/list.do?searchCondition=1&pageItm=100&searchKeyword='+quote('위탁운용사')+'&pageIndex=1', 'https://www.tp.or.kr/tp-kr/bbs/i-151/list.do?searchCondition=1&pageItm=100')]
          for institution,url,referer in targets:
            if os.environ['DIAGNOSE_INSTITUTION'] not in {institution,'all'}:continue
            if institution == 'kfinco':continue  # Dedicated metadata-only probe below.
            host=urlsplit(url).hostname
            for family in [socket.AF_UNSPEC,socket.AF_INET,socket.AF_INET6]:
              started=time.monotonic()
              try:
                addresses=sorted({a[4][0] for a in socket.getaddrinfo(host,443,family,socket.SOCK_STREAM)})
                print(json.dumps({'institution':institution,'resolver_family':family.name,'addresses':addresses,'seconds':round(time.monotonic()-started,3)}))
              except OSError as error:print(json.dumps({'institution':institution,'resolver_family':family.name,'errno':error.errno,'error':str(error),'seconds':round(time.monotonic()-started,3)}))
            if institution=='tp':
              tp_board='https://www.tp.or.kr/tp-kr/bbs/i-151/list.do'
              probes=[tp_board,'https://www.tp.or.kr/',
                tp_board+'?searchCondition=1',tp_board+'?pageItm=100',
                tp_board+'?searchKeyword='+quote('위탁운용사')+'&pageIndex=1',
                tp_board+'?searchCondition=1&pageItm=10&searchKeyword='+quote('위탁운용사')+'&pageIndex=1']
              for probe_index,probe_url in enumerate(probes):
                try:
                  try:
                    with build_opener().open(Request(probe_url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as response:
                      probe_raw=response.read(12582913);probe_status=response.status;probe_final_url=response.geturl()
                  except HTTPError as error:
                    probe_status=error.code;probe_raw=error.read(4096)
                  print(json.dumps({'institution':institution,'mode':'bare_official_page','url':probe_url,
                    'status':probe_status,'size':len(probe_raw),'sha256':hashlib.sha256(probe_raw).hexdigest(),
                    'text_excerpt':re.sub(r'\s+',' ',re.sub(r'<[^>]*>',' ',probe_raw.decode('utf-8','replace')))[:400] if probe_status!=200 else None},ensure_ascii=False))
                  if probe_status==200 and urlsplit(probe_url).path=='/tp-kr/bbs/i-151/list.do':
                    tp_board_metadata(probe_raw,probe_url,probe_index,probe_final_url)
                except Exception as error:print(json.dumps({'institution':institution,'mode':'bare_official_page','url':probe_url,'error':str(error)}))
            modes=['collector','curl_h1','curl_ipv4'] if institution=='cu' else ['collector','browser','warm_session','curl_h1']
            for mode in modes:
              headers={'User-Agent': 'Mozilla/5.0 (LP official board collector)' if mode=='collector' else 'Mozilla/5.0', 'Accept-Encoding':'identity','Connection':'close','Referer':referer}
              try:
                if mode.startswith('curl_'):
                  with tempfile.TemporaryDirectory() as folder:
                    path=Path(folder)/'body'
                    args=['curl','--http1.1','--fail-with-body','--max-time','20','--max-filesize','12582912','--silent','--show-error','--output',str(path),'--write-out','%{http_code}']
                    if mode=='curl_ipv4':args+=['--ipv4']
                    for key,value in headers.items():args+=['-H',key+': '+value]
                    result=subprocess.run(args+[url],capture_output=True,text=True,timeout=25)
                    raw=path.read_bytes() if path.exists() else b''
                    status=result.stdout
                    print(json.dumps({'institution':institution,'mode':mode,'curl_exit':result.returncode,'curl_error':result.stderr[:240]}))
                else:
                  opener=build_opener(HTTPCookieProcessor(CookieJar()))
                  if mode=='warm_session':
                    if institution=='tp':
                      # One ordinary board read distinguishes a board-wide HTTP
                      # failure from the configured title-search response.
                      try:
                        with opener.open(Request(referer,headers=headers),timeout=20) as response:
                          default_raw=response.read(12582913);default_status=response.status
                      except HTTPError as error:
                        default_status=error.code;default_raw=error.read(4096)
                      print(json.dumps({'institution':institution,'mode':'warm_default_page','url':referer,
                        'status':default_status,'size':len(default_raw),'sha256':hashlib.sha256(default_raw).hexdigest(),
                        'error_excerpt':default_raw[:240].decode('utf-8','replace') if default_status!=200 else None},ensure_ascii=False))
                    else:
                      with opener.open(Request(referer,headers=headers),timeout=20) as response:response.read(12582913)
                  try:
                    with opener.open(Request(url,headers=headers),timeout=20) as response:raw=response.read(12582913);status=response.status
                  except HTTPError as error:status=error.code;raw=error.read(4096)
                print(json.dumps({'institution':institution,'mode':mode,'status':status,'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'error_excerpt':raw[:240].decode('utf-8','replace') if str(status)!='200' else None},ensure_ascii=False))
              except Exception as error:print(json.dumps({'institution':institution,'mode':mode,'error':str(error)}))
      - name: Inspect only K-FINCO listing availability metadata
        if: inputs.institution == 'kfinco' || inputs.institution == 'all'
        shell: python3 {0}
        env:
          PYTHONPATH: ${{ github.workspace }}
          LP_SOURCE_WORKER_TOKEN: ${{ secrets.LP_SOURCE_WORKER_TOKEN }}
        run: |
          import hashlib, json, os
          from pathlib import Path
          from services.lp.src.lp_regional_transport import fetch_kfinco
          from services.lp.src.lp_board_adapter_kfinco import diagnostic_listing_metadata
          from services.lp.src.discover_kfinco_originals import LIST_URL
          folder=Path('/tmp/kfinco-http-diagnostic');folder.mkdir(exist_ok=True)
          result={'institution':'kfinco','url':LIST_URL,'mode':'regional metadata only'}
          try:
              raw=fetch_kfinco(LIST_URL,os.environ['LP_SOURCE_WORKER_TOKEN'])
              result.update(size=len(raw),sha256=hashlib.sha256(raw).hexdigest(),
                            listing=diagnostic_listing_metadata(raw),status='ok')
          except Exception as error:
              result.update(status='error',error_type=type(error).__name__)
          (folder/'listing-metadata.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False))
          if result['status']!='ok':raise SystemExit('K-FINCO metadata diagnosis failed')
      - name: Inspect served K-FINCO public certificate chain
        if: inputs.institution == 'kfinco' || inputs.institution == 'all'
        shell: python3 {0}
        run: |
          import hashlib, json, re, subprocess
          from pathlib import Path
          folder=Path('/tmp/kfinco-http-diagnostic');folder.mkdir(exist_ok=True)
          result=subprocess.run(['openssl','s_client','-connect','www.kfinco.co.kr:443','-servername','www.kfinco.co.kr',
            '-showcerts','-verify_return_error','-verify_hostname','www.kfinco.co.kr'],input='',capture_output=True,text=True,timeout=25)
          certificates=re.findall(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----',result.stdout,re.S)
          print(json.dumps({'mode':'strict public certificate inspection; no HTTP request','exit':result.returncode,'served_certificates':len(certificates),
            'verification_excerpt':result.stderr[-1000:]}))
          for index,pem in enumerate(certificates):
            path=folder/('served-chain-'+str(index)+'.pem');path.write_text(pem+'\n')
            info=subprocess.run(['openssl','x509','-in',str(path),'-noout','-text'],capture_output=True,text=True,timeout=5)
            lines=info.stdout.splitlines()
            metadata=[line.strip() for line in lines if any(key in line for key in ['Issuer:','Subject:','CA Issuers - URI:','Not Before:','Not After :'])]
            print(json.dumps({'mode':'public certificate metadata','index':index,'sha256':hashlib.sha256(pem.encode()).hexdigest(),'metadata':metadata}))
      - name: Keep K-FINCO availability metadata
        if: always() && (inputs.institution == 'kfinco' || inputs.institution == 'all')
        uses: actions/upload-artifact@v4
        with:
          name: kfinco-http-diagnostic
          path: /tmp/kfinco-http-diagnostic/
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep successful public TP board HTML
        if: always() && (inputs.institution == 'tp' || inputs.institution == 'all')
        uses: actions/upload-artifact@v4
        with:
          name: tp-http-diagnostic
          path: /tmp/tp-http-diagnostic/*.html
          retention-days: 7
          if-no-files-found: ignore
      - name: Install readers for explicit CU recovery verification
        if: inputs.verify_kdb_dns_recovery || inputs.verify_cu_regional_recovery || inputs.verify_cu_recovery || inputs.verify_institution_boards || inputs.verify_dns_recovery || inputs.verify_tp_collection
        run: python3 -m pip install 'pypdf==6.10.0' 'olefile==0.47'
      - name: Verify KDB alternate DNS with real official documents
        if: inputs.verify_kdb_dns_recovery
        run: python3 scripts/verify_lp_kdb_dns.py --output /tmp/lp-kdb-dns-verification.json
      - name: Keep KDB public DNS verification evidence
        if: always() && inputs.verify_kdb_dns_recovery
        uses: actions/upload-artifact@v4
        with:
          name: lp-kdb-dns-verification
          path: |
            /tmp/lp-kdb-dns-verification.json
            /tmp/lp-kdb-injected-collection.json
          retention-days: 7
          if-no-files-found: error
      - name: Verify two injected CU DNS failures with real Seoul documents
        if: inputs.verify_cu_regional_recovery
        env:
          LP_SOURCE_WORKER_TOKEN: ${{ secrets.LP_SOURCE_WORKER_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import json, socket
          from unittest.mock import Mock, patch
          from urllib.error import URLError
          from services.lp.src import collect_lp_institution_boards as boards
          from services.lp.src.lp_cu_transport import CuDnsError
          def injected_session(config):
              session=boards.Session(config)
              session.opener.open=Mock(side_effect=URLError(socket.gaierror(8,'injected first resolver failure')))
              return session
          with patch.object(boards,'fetch_cu_ipv4',side_effect=CuDnsError('injected native DNS failure')):
              report=boards.collect({'cu':boards.load_configs()['cu']},fetch_factory=injected_session)
          for notice in report['notices']:boards.validate_notice(notice,report['checked_at'])
          coverage=report['coverage']['cu']
          decoded=sum(bool(text.strip()) for notice in report['notices'] for text in notice.get('attachment_texts',{}).values())
          print(json.dumps({'mode':'two injected direct DNS failures; actual strict Seoul HTTPS bytes; no DB writes',
              'coverage':report['coverage'],'holds':report['holds'],'validated_notices':len(report['notices']),'decoded_attachments':decoded},ensure_ascii=False))
          assert decoded>0, 'CU attachments have no decoded text'
          assert not report['holds'], 'CU regional recovery failed'
          assert report['notices'] and coverage['attachment_count']>0, 'CU original documents or decoded attachments missing'
          assert coverage['regional_fetch_count']>0 and coverage['native_ipv4_fetch_count']==0
          PYCODE
      - name: Verify injected DNS failure with real official CU documents
        if: inputs.verify_cu_recovery
        run: |
          python3 - <<'PY'
          import json, socket
          from unittest.mock import Mock
          from urllib.error import URLError
          from services.lp.src.collect_lp_institution_boards import Session, collect, load_configs, validate_notice
          def injected_session(config):
            session=Session(config)
            session.opener.open=Mock(side_effect=URLError(socket.gaierror(8,'injected resolver failure')))
            return session
          report=collect({'cu':load_configs()['cu']},fetch_factory=injected_session)
          for notice in report['notices']:validate_notice(notice,report['checked_at'])
          print(json.dumps({'mode':'injected DNS failure; real official HTTPS bytes; no DB writes',
            'coverage':report['coverage'],'holds':report['holds'],'validated_notices':len(report['notices'])},ensure_ascii=False))
          assert not report['holds'], 'CU recovery failed'
          assert report['notices'], 'CU recovery did not find official documents'
          assert report['coverage']['cu']['native_ipv4_fetch_count']>0
          PY
      - name: Verify only configured TP collection without publication
        if: inputs.verify_tp_collection
        run: |
          python3 - <<'PY'
          import json
          from services.lp.src.collect_lp_institution_boards import collect, load_configs, validate_notice
          report=collect({'tp':load_configs()['tp']})
          for notice in report['notices']:validate_notice(notice,report['checked_at'])
          outages=[h for h in report['holds'] if h['stage'] in {'institution_listing','institution_detail','institution_depth'}]
          print(json.dumps({'mode':'TP only; real official requests; no injected errors; no DB writes',
            'coverage':report['coverage'],'holds':report['holds'],'validated_notices':len(report['notices'])},ensure_ascii=False))
          assert not outages, 'TP official collection failed'
          assert report['notices'], 'TP official collection found no documents'
          PY
      - name: Verify real configured institution boards without publication
        if: inputs.verify_institution_boards
        env:
          LP_SOURCE_WORKER_TOKEN: ${{ secrets.LP_SOURCE_WORKER_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          from services.lp.src.collect_lp_institution_boards import collect, validate_notice
          report=collect()
          for notice in report['notices']:validate_notice(notice,report['checked_at'])
          outages=[h for h in report['holds'] if h['stage'] in {'institution_listing','institution_detail','institution_depth'}]
          print(json.dumps({'mode':'real official requests; no injected errors; no DB writes',
            'coverage':report['coverage'],'holds':report['holds'],'validated_notices':len(report['notices'])},ensure_ascii=False))
          assert not outages, 'Official institution collection failed'
          PY
      - name: Verify injected DNS recovery across configured official boards
        if: inputs.verify_dns_recovery
        env:
          LP_SOURCE_WORKER_TOKEN: ${{ secrets.LP_SOURCE_WORKER_TOKEN }}
          DIAGNOSE_INSTITUTION: ${{ inputs.institution }}
        run: |
          python3 -u - <<'PY'
          import json, os, socket
          from unittest.mock import Mock
          from urllib.error import URLError
          from services.lp.src.collect_lp_institution_boards import Session, collect, load_configs, validate_notice
          def injected_session(config):
            session=Session(config)
            session.opener.open=Mock(side_effect=URLError(socket.gaierror(8,'injected resolver failure')))
            return session
          outages=[]
          for identity,config in load_configs().items():
            if os.environ['DIAGNOSE_INSTITUTION'] not in {identity,'all'}:continue
            report=collect({identity:config},fetch_factory=injected_session)
            for notice in report['notices']:validate_notice(notice,report['checked_at'])
            outages.extend(h for h in report['holds'] if h['stage'] in {'institution_listing','institution_detail','institution_depth'})
            print(json.dumps({'mode':'injected DNS failure; real official HTTPS bytes; no DB writes',
              'institution':identity,'coverage':report['coverage'],'holds':report['holds'],
              'validated_notices':len(report['notices'])},ensure_ascii=False),flush=True)
          assert not outages, 'Official institution DNS recovery failed'
          PY

  kexim-current-listing:
    if: inputs.institution == 'kexim' && !inputs.verify_kexim_result && github.repository == 'pkkong/korea-pef-db' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Capture only the current first KEXIM listing before parsing
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,re,sys
          from datetime import datetime,timezone
          from pathlib import Path
          from urllib.parse import urlsplit
          sys.path.insert(0,str(Path('services/lp/src').resolve()))
          import collect_kexim_programs as k
          out=Path('/tmp/kexim-current-listing');out.mkdir()
          url=k.BOARD+'?curPage=1';limit=12*1024*1024
          result={'checked_at':datetime.now(timezone.utc).isoformat(),'url':url,'success':False,
                  'logical_listing_requests':1,'transport_attempts':'not_measured',
                  'detail_requests':0,'attachment_requests':0,'database_writes':0,'published':False,
                  'scope':'current_first_listing_only_not_complete_board_or_market','rows':[],'errors':[]}
          try:
              raw=k._official_fetch(url)
              prefix=raw[:limit]
              (out/'listing-response.bin').write_bytes(prefix)
              result['response']={'bytes':len(prefix),'sha256':hashlib.sha256(prefix).hexdigest(),'truncated':len(raw)>limit}
              (out/'listing.json').write_text(json.dumps(result,ensure_ascii=False))
              assert 0<len(raw)<=limit,'Listing size limit'
              html=k._decode(raw)
              assert '</html>' in html.lower() and 'notice-list-item' in html,'Incomplete official listing'
              rows=k.extract_kexim_notice_rows(html,url,['펀드'])
              for row in rows:
                  parsed=urlsplit(row['link'])
                  assert parsed.scheme=='https' and parsed.netloc==urlsplit(k.BASE).netloc
                  assert re.fullmatch(r'/HPHKBI039M01/[0-9]+',parsed.path)
                  assert re.fullmatch(r'20[0-9]{2}-[0-9]{2}-[0-9]{2}',row['announced_date'])
                  row['stage']=k._stage(row['title'])
              result['rows']=rows;result['success']=True
          except Exception as error:
              result['errors'].append({'type':type(error).__name__,'code':'current_listing_capture_or_parse_failed'})
          finally:
              (out/'listing.json').write_text(json.dumps(result,ensure_ascii=False))
          print(json.dumps({key:result[key] for key in ('success','logical_listing_requests','detail_requests','attachment_requests','rows','errors')},ensure_ascii=False))
          if not result['success']:raise SystemExit('Current first KEXIM listing unavailable; retained evidence preserved')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kexim-current-listing
          path: /tmp/kexim-current-listing
          retention-days: 30
          if-no-files-found: warn

  kexim-result-file:
    if: inputs.institution == 'kexim' && inputs.verify_kexim_result && github.repository == 'pkkong/korea-pef-db' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify the exact retained listing and collection sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LISTING_RUN: ${{ inputs.kexim_listing_run }}
          COLLECTION_RUN: ${{ inputs.kexim_collection_run }}
        run: |
          python3 - <<'PYCODE'
          import json,os,subprocess
          from pathlib import Path
          provenance={}
          for key,path in (('LISTING_RUN','diagnose-lp-board-http.yml'),('COLLECTION_RUN','collect-kgrowth-programs.yml')):
              ident=os.environ[key];assert ident.isascii() and ident.isdecimal() and int(ident)>0
              run=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/actions/runs/{ident}"]))
              assert run['repository']['full_name']==os.environ['GH_REPO'] and run['head_branch']=='main'
              assert run['path']=='.github/workflows/'+path and run['status']=='completed'
              assert run['event'] in ('schedule','workflow_dispatch')
              assert run['conclusion']=='success' if key=='LISTING_RUN' else run['conclusion'] in ('success','failure')
              provenance[key]={k:run[k] for k in ('id','path','head_sha','conclusion')}
          out=Path('/tmp/kexim-result-proof');out.mkdir()
          (out/'provenance.json').write_text(json.dumps(provenance))
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          name: kexim-current-listing
          run-id: ${{ inputs.kexim_listing_run }}
          github-token: ${{ github.token }}
          path: /tmp/kexim-result-listing
      - uses: actions/download-artifact@v4
        with:
          name: kgrowth-collection
          run-id: ${{ inputs.kexim_collection_run }}
          github-token: ${{ github.token }}
          path: /tmp/kexim-result-baseline
      - name: Install the pinned complete-body decoders
        run: python3 -m pip install 'pypdf==6.10.0' 'olefile==0.47'
      - name: Replay proof boundaries before official requests
        run: python3 -m unittest services.lp.tests.test_collect_kexim_programs services.lp.tests.test_lp_attachment_text
      - name: Capture at most one automatically discovered result body and first file
        env:
          RESULT_STAGE: ${{ inputs.kexim_result_stage }}
        run: |
          python3 - <<'PYCODE'
          import base64,hashlib,json,os,re,sys
          from datetime import datetime,timezone
          from pathlib import Path
          from urllib.parse import urlsplit
          sys.path.insert(0,str(Path('services/lp/src').resolve()))
          import collect_kexim_programs as k
          out=Path('/tmp/kexim-result-proof')
          result={'success':False,'listing_requests':0,'detail_requests':0,'attachment_requests':0,
                  'transport_attempts':'not_measured','database_writes':0,'published':False,
                  'pe_approval':False,'selected_gp_approval':False,'errors':[]}
          try:
              listing=json.loads(Path('/tmp/kexim-result-listing/listing.json').read_text())
              raw_listing=Path('/tmp/kexim-result-listing/listing-response.bin').read_bytes()
              assert listing['success'] is True and listing['scope']=='current_first_listing_only_not_complete_board_or_market'
              assert len(raw_listing)==listing['response']['bytes'] and hashlib.sha256(raw_listing).hexdigest()==listing['response']['sha256']
              rows=k.extract_kexim_notice_rows(k._decode(raw_listing),listing['url'],['펀드'])
              for row in rows:row['stage']=k._stage(row['title'])
              assert rows==listing['rows'],'Retained listing differs from raw bytes'
              baseline=json.loads(Path('/tmp/kexim-result-baseline/lp-priority-collection.json').read_text())['sources']['kexim']
              assert baseline['notices'] and not baseline.get('error')
              by_id={str(n['source_id']):n for n in baseline['notices']}
              stage=os.environ['RESULT_STAGE'];assert stage in {'final','screening'}
              targets=[r for r in rows if r['stage']==('최종 선정' if stage=='final' else '서류심사 결과')]
              if stage=='screening':
                  targets=[r for r in targets if any(k._title_matches(recipe,r['title']) for recipe in k._recipes())
                           and re.fullmatch(r'/HPHKBI039M01/([0-9]+)',urlsplit(r['link']).path)[1] not in k._approved_source_ids()]
              assert targets,'No matching result in this retained page; do not infer absence elsewhere'
              target=sorted(targets,key=lambda r:(r['announced_date'],r['link']),reverse=True)[0]
              ident=re.fullmatch(r'/HPHKBI039M01/([0-9]+)',urlsplit(target['link']).path)[1]
              assert ident in by_id,'Inspect a newly discovered result before using an older baseline'
              previous=by_id[ident]
              assert previous['sha256']==k.fingerprint(previous)
              assert previous['title']==target['title'] and previous['date']==target['announced_date']
              result['source_id']=ident;result['source_url']=k.BOARD+'/'+ident
              cookies={};result['detail_requests']=1
              raw_body=k._official_fetch(result['source_url'],cookies)
              (out/'detail-response.bin').write_bytes(raw_body)
              result['detail_sha256']=hashlib.sha256(raw_body).hexdigest()
              notice=k.parse_detail(ident,raw_body)
              assert notice['title']==target['title'] and notice['date']==target['announced_date']
              assert notice['sha256']==previous['sha256'],'Result body changed; retained response requires review'
              notice['detail_proof']={'kind':'kexim_detail_body_v1','raw_base64':base64.b64encode(raw_body).decode('ascii'),
                                      'sha256':hashlib.sha256(raw_body).hexdigest(),'byte_length':len(raw_body)}
              notice['checked_at']=datetime.now(timezone.utc).isoformat();notice['attachment_hashes']={};notice['attachment_texts']={}
              file=notice['attachments'][0]
              k._attachment_identity(notice,file['url'])
              result['attachment_requests']=1
              raw_file=k._official_fetch(file['url'],cookies)
              (out/'attachment-response.bin').write_bytes(raw_file)
              notice['attachment_hashes'][file['url']]=hashlib.sha256(raw_file).hexdigest()
              k.retain_attachment_proof(notice,raw_file)
              (out/'notice.json').write_text(json.dumps(notice,ensure_ascii=False))
              decoded=k.validate_attachment_proof(notice)
              assert decoded is not None,'Canonical result file unreadable; raw evidence retained'
              result.update(success=True,title=notice['title'],date=notice['date'],format=decoded['format'],
                            text_chars=len(decoded['text']),file_bytes=len(raw_file),
                            file_sha256=notice['attachment_hashes'][file['url']],
                            previous_attachment_hash_equal=notice['attachment_hashes']==previous.get('attachment_hashes'))
          except Exception as error:
              result['errors'].append({'type':type(error).__name__,'code':'bounded_result_capture_or_replay_failed'})
          finally:
              (out/'result.json').write_text(json.dumps(result,ensure_ascii=False))
          print(json.dumps(result,ensure_ascii=False))
          if not result['success']:raise SystemExit('Result evidence held; original response preserved')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kexim-result-proof
          path: /tmp/kexim-result-proof
          retention-days: 30
          if-no-files-found: warn
