name: Diagnose KGrowth public session
on:
  workflow_dispatch:
    inputs:
      listing_run:
        description: Successful completed KGrowth historical listing run
        type: string
        required: true
      failure_run:
        description: Completed failed KGrowth file run with saved abnormal-access bytes
        type: string
        required: true
      body_run:
        description: Successful historical body run, including a partial body cursor
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: lp-program-collection
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'pkkong/korea-pef-db' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify retained historical artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LISTING_RUN: ${{ inputs.listing_run }}
          BODY_RUN: ${{ inputs.body_run }}
          FAILURE_RUN: ${{ inputs.failure_run }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          sources={}
          for key,workflow in (('LISTING_RUN','discover-lp-history.yml'),('BODY_RUN','collect-lp-history-bodies.yml'),('FAILURE_RUN','collect-kgrowth-history-attachments.yml')):
              ident=os.environ[key]
              assert ident.isascii() and ident.isdecimal() and int(ident)>0,'Numeric Actions run required'
              run=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/actions/runs/{ident}"]))
              assert run['repository']['full_name']==os.environ['GH_REPO'] and run['head_branch']=='main'
              assert run['path']=='.github/workflows/'+workflow and run['event']=='workflow_dispatch'
              expected='failure' if key=='FAILURE_RUN' else 'success'
              assert run['status']=='completed' and run['conclusion']==expected,'Inspect the precise completed source state'
              sources[key]={k:run[k] for k in ('id','path','head_sha','conclusion')}
          out=Path('/tmp/lp-growth-session-control');out.mkdir()
          (out/'provenance.json').write_text(json.dumps(sources))
          print(json.dumps(sources))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: lp-history-listings
          run-id: ${{ inputs.listing_run }}
          github-token: ${{ github.token }}
          path: /tmp/lp-history-listing
      - uses: actions/download-artifact@v4
        with:
          name: lp-history-bodies
          run-id: ${{ inputs.body_run }}
          github-token: ${{ github.token }}
          path: /tmp/lp-history-bodies
      - uses: actions/download-artifact@v4
        with:
          name: kgrowth-history-attachments
          run-id: ${{ inputs.failure_run }}
          github-token: ${{ github.token }}
          path: /tmp/lp-history-failure
      - name: Install original file readers
        run: python3 -m pip install 'pypdf==6.10.0' 'olefile==0.47'
      - name: Test normal public-session control and protection boundaries
        run: python3 -m unittest services.lp.tests.test_diagnose_kgrowth_history_session
      - name: Check one unchanged public notice and its linked file with an anonymous session
        run: |
          python3 services/lp/src/diagnose_kgrowth_history_session.py --listing-state /tmp/lp-history-listing/history-state.json --body-state /tmp/lp-history-bodies/body-state.json --failed-state /tmp/lp-history-failure/attachment-state.json --output-dir /tmp/lp-growth-session-control
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kgrowth-history-session-control
          path: /tmp/lp-growth-session-control
          retention-days: 30
          if-no-files-found: warn
