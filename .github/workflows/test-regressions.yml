name: Test regressions

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEWSLETTER_SKIP_BRAND_ASSET_DOWNLOADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python3 -m pip install -r services/newsletter/web/requirements.txt

      - name: Run every regression test
        run: python3 scripts/run_regression_tests.py

      - name: Check architecture contracts
        run: python3 scripts/check_architecture_contracts.py

      - name: Set up Node for PostgreSQL integration tests
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test database transactions and failure recovery
        run: |
          npm ci --prefix scripts/tests/sql --ignore-scripts
          npm test --prefix scripts/tests/sql
