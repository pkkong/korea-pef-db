name: Collect LP programs

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0,6 * * 1-5'

permissions:
  contents: read

concurrency:
  group: lp-program-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install collection dependencies
        run: python3 -m pip install 'psycopg[binary]>=3.2,<4' beautifulsoup4 requests 'pypdf==6.10.0'
      - name: Apply LP schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --file services/lp/supabase/migrations/20260921090000_lp_program_collection.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --file services/lp/supabase/migrations/20260929090000_lp_review.sql
      - name: Verify review access boundary
        run: psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --file services/lp/tests/check_lp_review_access.sql
      - name: Test collection and publishing contracts
        run: python3 -m unittest services.lp.tests.test_lp_review_preview services.lp.tests.test_lp_review_decisions services.lp.tests.test_kgrowth_collection services.lp.tests.test_kgrowth_program_review services.lp.tests.test_collect_ktcu_program services.lp.tests.test_collect_koreapost_program services.lp.tests.test_collect_kexim_programs services.lp.tests.test_lp_program_service services.lp.tests.test_lp_program_publish
      - name: Diagnose official KEXIM certificate
        if: github.event_name == 'workflow_dispatch'
        run: |
          openssl s_client -connect www.koreaexim.go.kr:443 -servername www.koreaexim.go.kr -showcerts </dev/null 2>&1 | grep -E 'depth=|verify error|Verify return code|subject=|issuer=|BEGIN CERTIFICATE' || true
          python3 - <<'PY'
          import ssl,urllib.request
          print('Python TLS:',ssl.OPENSSL_VERSION,ssl.get_default_verify_paths())
          try:
              with urllib.request.urlopen('https://www.koreaexim.go.kr/HPHKBI039M01?curPage=1',timeout=20) as response:
                  print('Official board:',response.status)
          except Exception as error:
              print('Official board TLS error:',repr(error))
          try:
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
              with opener.open('https://www.koreaexim.go.kr/HPHKBI039M01?curPage=1',timeout=20) as response:
                  print('Direct verified board:',response.status)
          except Exception as error:
              print('Direct verified board error:',repr(error))
          try:
              context=ssl.create_default_context()
              context.load_verify_locations(cafile='services/lp/certs/kexim_ca_chain.pem')
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),urllib.request.HTTPSHandler(context=context))
              with opener.open('https://www.koreaexim.go.kr/HPHKBI039M01?curPage=1',timeout=20) as response:
                  print('Pinned CA verified board:',response.status)
          except Exception as error:
              print('Pinned CA verified board error:',repr(error))
          PY
      - name: Load last published data
        run: python3 services/lp/src/publish_lp_programs.py --export-baseline /tmp/lp-baseline.json
      - name: Collect official announcements
        run: python3 services/lp/src/collect_kgrowth_programs.py --baseline /tmp/lp-baseline.json --output /tmp/kgrowth-collection.json
      - name: Collect Korea Post, KTCU, and KEXIM announcements
        run: python3 services/lp/src/collect_priority_lp_programs.py --output /tmp/lp-priority-collection.json
      - name: Store evidence and publish verified pages
        run: |
          set -o pipefail
          python3 services/lp/src/publish_lp_programs.py --collection /tmp/kgrowth-collection.json --priority-collection /tmp/lp-priority-collection.json | tee /tmp/kgrowth-publication.json
      - name: Verify published page
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          expected = json.load(open('/tmp/kgrowth-publication.json'))['run_id']
          report = json.load(open('/tmp/kgrowth-collection.json'))
          priority = json.load(open('/tmp/lp-priority-collection.json'))
          ids = ['kgrowth-2026-bank-valueup-3'] + [p['id'] for p in report.get('reviewed_programs', [])]
          ids += [p['id'] for s in priority['sources'].values() for p in s.get('programs', [])]
          for program_id in ids:
              url = f'https://kpef-newsletter.vercel.app/samples/lp/program-{program_id}.html'
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as response:
                          assert response.headers.get('X-LP-Data-Source') == 'supabase'
                          assert response.headers.get('X-LP-Run') == expected
                          assert '단계별 GP' in response.read().decode('utf-8')
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(5)
          print('Published LP page matches this collection run')
          PY
      - name: Report official source outages
        run: |
          python3 - <<'PY'
          import json
          sources=json.load(open('/tmp/lp-priority-collection.json'))['sources']
          errors={key:value['error'] for key,value in sources.items() if value.get('error')}
          if errors:
              raise SystemExit(f'LP official source collection failed: {errors}')
          PY
      - name: Keep collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgrowth-collection
          path: |
            /tmp/kgrowth-collection.json
            /tmp/kgrowth-collection.md
            /tmp/lp-priority-collection.json
          if-no-files-found: ignore
          retention-days: 30
