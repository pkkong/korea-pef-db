name: Collect LP programs

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0,6 * * 1-5'

permissions:
  contents: read

concurrency:
  group: lp-program-collection
  cancel-in-progress: false

jobs:
  collect-shared:
    # Several Korean boards intermittently stall from the Ubuntu runner path.
    # Keep the same discovery/validation on the macOS path used by issuer jobs.
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official attachment readers
        run: python3 -m pip install 'pypdf==6.10.0' 'olefile==0.47'
      - name: Test shared official-board discovery
        run: python3 -m unittest services.lp.tests.test_collect_shared_lp_notices services.lp.tests.test_collect_lp_original_notices services.lp.tests.test_discover_lp_original_boards services.lp.tests.test_discover_growth_originals services.lp.tests.test_discover_kfinco_originals services.lp.tests.test_lp_shared_notice_terms services.lp.tests.test_lp_shared_notice_catalog services.lp.tests.test_lp_contest_screening
      - name: Discover institution notices on association boards
        run: python3 services/lp/src/collect_shared_lp_notices.py --pages 3 --output /tmp/lp-shared-collection.json
      - name: Follow observed institution original notice links
        run: python3 services/lp/src/collect_lp_original_notices.py --input /tmp/lp-shared-collection.json --output /tmp/lp-shared-collection.json
      - name: Discover matching originals on official institution boards
        run: python3 services/lp/src/discover_lp_original_boards.py --input /tmp/lp-shared-collection.json --output /tmp/lp-shared-collection.json --pages 2 --skip-native-boards
      - name: Pass association evidence to publisher
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp-shared-collection
          path: /tmp/lp-shared-collection.json
          if-no-files-found: error
  collect-institution-boards:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      LP_SOURCE_WORKER_TOKEN: ${{ secrets.LP_SOURCE_WORKER_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official attachment readers
        run: python3 -m pip install 'pypdf==6.10.0' 'olefile==0.47' 'truststore==0.10.5'
      - name: Test independent institution-board discovery
        run: python3 -m unittest services.lp.tests.test_lp_board_adapters_mutuals services.lp.tests.test_lp_board_adapters_pensions services.lp.tests.test_lp_board_adapter_kfcc services.lp.tests.test_lp_board_adapters_banks services.lp.tests.test_lp_board_adapter_pck services.lp.tests.test_lp_board_adapter_sema services.lp.tests.test_lp_board_adapter_mmaa services.lp.tests.test_lp_board_adapter_kbiz services.lp.tests.test_lp_board_adapter_geps services.lp.tests.test_lp_board_adapter_kamco services.lp.tests.test_lp_board_adapter_moel services.lp.tests.test_lp_board_adapter_kfinco services.lp.tests.test_lp_kbiz_notice_terms services.lp.tests.test_lp_kfinco_notice_terms services.lp.tests.test_collect_lp_institution_boards services.lp.tests.test_lp_institution_notice_terms services.lp.tests.test_lp_kfcc_notice_terms services.lp.tests.test_lp_three_board_collection services.lp.tests.test_lp_regional_transport services.lp.tests.test_lp_cu_transport services.lp.tests.test_lp_ipv4_transport
      - name: Discover configured official institution boards
        run: python3 services/lp/src/collect_lp_institution_boards.py --output /tmp/lp-institution-collection.json
      - name: Pass direct institution evidence to publisher
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp-institution-collection
          path: /tmp/lp-institution-collection.json
          if-no-files-found: error
  collect-ktcu:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official PDF reader
        run: python3 -m pip install 'pypdf==6.10.0'
      - name: Collect official KTCU evidence on the issuer runner path
        run: python3 services/lp/src/collect_ktcu_program.py --output /tmp/ktcu-collection.json
      - name: Pass official evidence to publisher
        uses: actions/upload-artifact@v4
        with:
          name: ktcu-collection
          path: /tmp/ktcu-collection.json
          if-no-files-found: error
  collect-koreapost:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: python3 -m pip install 'pypdf==6.10.0'
      - name: Collect official Korea Post notices
        run: python3 services/lp/src/collect_koreapost_program.py --output /tmp/koreapost-collection.json
      - name: Pass official evidence to publisher
        uses: actions/upload-artifact@v4
        with:
          name: koreapost-collection
          path: /tmp/koreapost-collection.json
          if-no-files-found: error
  collect-kexim:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: python3 -m pip install 'pypdf==6.10.0'
      - name: Collect official KEXIM notices
        run: python3 services/lp/src/collect_kexim_programs.py --output /tmp/kexim-collection.json
      - name: Pass official evidence to publisher
        uses: actions/upload-artifact@v4
        with:
          name: kexim-collection
          path: /tmp/kexim-collection.json
          if-no-files-found: error
  collect-kfinco:
    needs: collect-shared
    if: always()
    runs-on: macos-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install readers and native certificate verifier
        run: python3 -m pip install 'pypdf==6.10.0' 'olefile==0.47' 'truststore==0.10.5'
      - name: Receive discovered association evidence
        uses: actions/download-artifact@v4
        with:
          name: lp-shared-collection
          path: /tmp
      - name: Collect K-FINCO originals with system TLS verification
        env:
          LP_SOURCE_WORKER_TOKEN: ${{ secrets.LP_SOURCE_WORKER_TOKEN }}
        run: python3 services/lp/src/discover_kfinco_originals.py --system-trust --input /tmp/lp-shared-collection.json --output /tmp/lp-kfinco-collection.json
      - name: Pass original evidence to publisher
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp-kfinco-collection
          path: /tmp/lp-kfinco-collection.json
          if-no-files-found: error
  collect:
    needs: [collect-ktcu, collect-koreapost, collect-kexim, collect-shared, collect-kfinco, collect-institution-boards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install collection dependencies
        run: python3 -m pip install 'psycopg[binary]>=3.2,<4' beautifulsoup4 requests 'pypdf==6.10.0' 'olefile==0.47'
      - name: Apply LP schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --file services/lp/supabase/migrations/20260921090000_lp_program_collection.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --file services/lp/supabase/migrations/20260929090000_lp_review.sql
      - name: Verify review access boundary
        run: psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --file services/lp/tests/check_lp_review_access.sql
      - name: Test PCK track and round publication contracts
        run: python3 -m unittest services.lp.tests.test_lp_pck_programs
      - name: Test collection and publishing contracts
        run: python3 -m unittest services.lp.tests.test_lp_attachment_text services.lp.tests.test_kgrowth_notice_terms services.lp.tests.test_lp_review_preview services.lp.tests.test_lp_review_decisions services.lp.tests.test_kgrowth_collection services.lp.tests.test_kgrowth_program_review services.lp.tests.test_collect_ktcu_program services.lp.tests.test_collect_koreapost_program services.lp.tests.test_collect_kexim_programs services.lp.tests.test_collect_kdb_related services.lp.tests.test_collect_priority_lp_programs services.lp.tests.test_lp_notice_triage services.lp.tests.test_lp_notice_terms services.lp.tests.test_lp_joint_terms services.lp.tests.test_lp_program_service services.lp.tests.test_lp_program_publish services.lp.tests.test_lp_notice_publication services.lp.tests.test_lp_notice_stages
      - name: Receive official KTCU evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ktcu-collection
          path: /tmp
      - name: Receive official KEXIM evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: kexim-collection
          path: /tmp
      - name: Receive official Korea Post evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: koreapost-collection
          path: /tmp
      - name: Receive association evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lp-shared-collection
          path: /tmp
      - name: Receive K-FINCO original evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lp-kfinco-collection
          path: /tmp
      - name: Receive direct institution evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lp-institution-collection
          path: /tmp
      - name: Load last published data
        run: |
          python3 services/lp/src/publish_lp_programs.py --export-baseline /tmp/lp-baseline.json
          python3 services/lp/src/publish_lp_programs.py --export-source-index /tmp/lp-source-index.json
      - name: Collect official announcements
        run: python3 services/lp/src/collect_kgrowth_programs.py --baseline /tmp/lp-baseline.json --lookback-days 365 --listing-pages 20 --output /tmp/kgrowth-collection.json
      - name: Collect Korea Post, KTCU, and KEXIM announcements
        run: python3 services/lp/src/collect_priority_lp_programs.py --ktcu-input /tmp/ktcu-collection.json --koreapost-input /tmp/koreapost-collection.json --kexim-input /tmp/kexim-collection.json --output /tmp/lp-priority-collection.json
      - name: Find earlier and remaining institution recruitment originals
        run: |
          if [ -f /tmp/lp-kfinco-collection.json ]; then
            cp /tmp/lp-kfinco-collection.json /tmp/lp-shared-collection.json
          fi
          if [ -f /tmp/lp-shared-collection.json ]; then
            python3 services/lp/src/discover_growth_originals.py --input /tmp/lp-shared-collection.json --native-input /tmp/kgrowth-collection.json --output /tmp/lp-shared-collection.json
          fi
      - name: Store evidence and publish verified pages
        run: |
          set -o pipefail
          python3 services/lp/src/publish_lp_programs.py --collection /tmp/kgrowth-collection.json --priority-collection /tmp/lp-priority-collection.json --shared-collection /tmp/lp-shared-collection.json --institution-collection /tmp/lp-institution-collection.json | tee /tmp/kgrowth-publication.json
      - name: Compare independent discovery without approving public facts
        if: always()
        run: |
          python3 services/lp/src/audit_lp_discovery_coverage.py --baseline /tmp/lp-baseline.json --official-collection /tmp/lp-source-index.json --official-collection /tmp/kgrowth-collection.json --official-collection /tmp/lp-priority-collection.json --official-collection /tmp/lp-shared-collection.json --official-collection /tmp/lp-institution-collection.json --output /tmp/lp-discovery-audit.json --markdown /tmp/lp-discovery-audit.md
          python3 - <<'PY'
          import json, os
          report=json.load(open('/tmp/lp-discovery-audit.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('\nLP independent discovery comparison: '+json.dumps(report['summary'])+'\n')
          if report['status'] != 'ok':
              print('::warning::Discovery comparison unavailable; official collection status remains independent')
          PY
      - name: Verify published page
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          publication = json.load(open('/tmp/kgrowth-publication.json'))
          expected = publication['run_id']
          report = json.load(open('/tmp/kgrowth-collection.json'))
          priority = json.load(open('/tmp/lp-priority-collection.json'))
          ids = publication['program_ids']
          baseline_ids = {p['id'] for p in json.load(open('/tmp/lp-baseline.json'))['programs']}
          assert baseline_ids <= set(ids), 'Previously published LP programs must be retained'
          for program_id in ids:
              url = f'https://kpef-lp.vercel.app/program-{program_id}.html'
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as response:
                          assert response.headers.get('X-LP-Data-Source') == 'supabase'
                          assert response.headers.get('X-LP-Run') == expected
                          assert '진행 일정' in response.read().decode('utf-8')
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(5)
          assert publication['institution_validation_errors'] == 0, 'Direct institution receipt validation failed; archive retained'
          print('Published LP page matches this collection run')
          PY
      - name: Report official source outages
        run: |
          python3 - <<'PY'
          import json
          sources=json.load(open('/tmp/lp-priority-collection.json'))['sources']
          errors={key:value['error'] for key,value in sources.items() if value.get('error')}
          if errors:
              raise SystemExit(f'LP official source collection failed: {errors}')
          from pathlib import Path
          path=Path('/tmp/lp-shared-collection.json')
          if not path.exists():
              raise SystemExit('Association source evidence artifact is missing; previous archive retained')
          if not Path('/tmp/lp-kfinco-collection.json').exists():
              raise SystemExit('K-FINCO original evidence artifact is missing; previous archive retained')
          institution=Path('/tmp/lp-institution-collection.json')
          if not institution.exists():
              raise SystemExit('Direct institution evidence artifact is missing; previous archive retained')
          direct=json.loads(institution.read_text())
          direct_errors=[h for h in direct.get('holds', []) if h.get('stage') in ('institution_listing','institution_detail','institution_depth')]
          if direct_errors:
              raise SystemExit(f'Institution board discovery failed: {direct_errors}')
          print(f"Direct institution collection: {len(direct['notices'])} notices; attachment holds: {len(direct.get('holds', []))}")
          shared=json.loads(path.read_text())
          errors=[h for h in shared.get('holds', []) if h.get('stage') in ('listing','detail','original_board') or (h.get('stage') in ('growth_search','kfinco_original') and h.get('phase') in ('listing','detail'))]
          if errors:
              raise SystemExit(f'Official board listing/detail collection failed: {errors}')
          PY
      - name: Keep collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgrowth-collection
          path: |
            /tmp/kgrowth-collection.json
            /tmp/kgrowth-collection.md
            /tmp/lp-priority-collection.json
            /tmp/lp-shared-collection.json
            /tmp/lp-institution-collection.json
            /tmp/kgrowth-publication.json
            /tmp/lp-discovery-audit.json
            /tmp/lp-discovery-audit.md
          if-no-files-found: ignore
          retention-days: 30
