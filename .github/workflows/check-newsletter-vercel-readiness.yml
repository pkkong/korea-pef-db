name: Check newsletter Vercel readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsletter-vercel-readiness
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEWSLETTER_ARCHIVE_URL: https://pkkong.github.io/kpef-newsletter/archive.json
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install newsletter web dependencies
        working-directory: services/newsletter/web
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Check standalone app readiness
        run: |
          python3 services/newsletter/scripts/check_vercel_supabase_readiness.py | tee readiness.json

      - name: Run Vercel data and UI contract tests
        run: |
          python3 services/newsletter/web/tests/test_newsletter_data.py

      - name: Smoke test Flask app
        run: |
          python3 services/newsletter/scripts/check_vercel_supabase_readiness.py --smoke-app

      - name: Summarize credential state
        run: |
          python3 services/newsletter/scripts/check_vercel_supabase_readiness.py \
            --summary-from readiness.json >> "$GITHUB_STEP_SUMMARY"
