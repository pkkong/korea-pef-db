name: Verify retained LP KGrowth history

# A request-file push only: recover missing raw detail evidence for one
# automatically selected PE group, joint originals, or a scoped follow-up.
# Press scopes retain a listing, its verified detail, or the detail's observed PDF.
# No DB credentials, publication, manual dispatch,
# or notice-ID inputs. Originals stay in an artifact.
on:
  push:
    branches: [main]
    paths:
      - data/lp_kgrowth_history_check_request.json

permissions:
  contents: read

concurrency:
  group: lp-program-collection
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Load the pinned retained bundle
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess
          request = json.loads(pathlib.Path('data/lp_kgrowth_history_check_request.json').read_bytes())
          fields = {'bundle_commit', 'bundle_sha256', 'reason', 'attempt', 'review_scope'}
          scope = request.get('review_scope')
          if scope == 'enterprise_recruitment':
              fields.add('recruitment')
          proof_roles = ('prior', 'followup', 'result', 'failed')
          proof_count = {'press_followup': 1, 'press_result': 2, 'press_pdf': 3, 'press_pdf_session': 4}.get(scope, 0)
          if proof_count:
              fields.add('prior_press_commit')
              fields.update(role + '_press_sha256' for role in proof_roles[:proof_count])
          assert set(request) == fields
          commit, digest = request['bundle_commit'], request['bundle_sha256']
          assert re.fullmatch(r'[a-f0-9]{40}', commit)
          assert re.fullmatch(r'[a-f0-9]{64}', digest)
          assert type(request['attempt']) is int and request['attempt'] > 0
          assert proof_count or scope in {'pe_roster', 'joint_originals', 'newdeal_followups', 'press_listing', 'press_search',
                                         'enterprise_recruitment'}
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', commit], check=True)
          raw = subprocess.check_output(['git', 'show', commit + ':kgrowth.json'])
          assert len(raw) <= 40 * 1024 * 1024
          assert hashlib.sha256(raw).hexdigest() == digest
          out = pathlib.Path('/tmp/lp-kgrowth-history-check')
          out.mkdir()
          (out / 'bundle.json').write_bytes(raw)
          (out / 'request.json').write_text(json.dumps(request, ensure_ascii=False, indent=2))
          if proof_count:
              prior_commit = request['prior_press_commit']
              assert re.fullmatch(r'[a-f0-9]{40}', prior_commit)
              subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', prior_commit], check=True)
              for role in proof_roles[:proof_count]:
                  source = 'press-' + ('search' if role == 'prior' else role)
                  key = role + '_press_sha256'
                  expected = request[key]
                  assert re.fullmatch(r'[a-f0-9]{64}', expected)
                  data = subprocess.check_output(['git', 'show', prior_commit + ':' + source + '-capture.json'])
                  assert len(data) <= 40 * 1024 * 1024 and hashlib.sha256(data).hexdigest() == expected
                  (out / (role + '-capture.json')).write_bytes(data)
          PY
      - name: Retain bounded official responses and press evidence
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('/tmp/lp-kgrowth-history-check')
          request = json.loads((root / 'request.json').read_text())
          if request['review_scope'] == 'enterprise_recruitment':
              result = subprocess.run(['python3', 'services/lp/src/lp_kgrowth_enterprise_recruitment.py',
                                       '--bundle', str(root / 'bundle.json'), '--request', str(root / 'request.json'),
                                       '--out', str(root / 'capture.json')])
              raise SystemExit(result.returncode)
          args = ['python3', 'services/lp/src/lp_kgrowth_history_replay.py',
                  '--bundle', str(root / 'bundle.json'), '--capture-details',
                  '--review-scope', request['review_scope'], '--out', str(root / 'capture.json')]
          for role, flag in (('prior', '--capture'), ('followup', '--followup-capture'),
                             ('result', '--result-capture'), ('failed', '--failed-capture')):
              path = root / (role + '-capture.json')
              if path.exists():
                  args += [flag, str(path)]
          subprocess.run(args, check=True)
          PY
      - name: Keep raw responses including a failed attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp-kgrowth-history-check
          path: /tmp/lp-kgrowth-history-check
          retention-days: 90
          if-no-files-found: error
