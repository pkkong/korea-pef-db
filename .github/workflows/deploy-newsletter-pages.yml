name: Deploy newsletter to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date in YYYY-MM-DD. Leave blank for today's date in Asia/Seoul."
        required: false
        type: string
  schedule:
    # 08:30 KST every weekday.
    - cron: "30 23 * * 0-4"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-newsletter-pages.yml"
      - "services/newsletter/**"
      - "scripts/build_service_site.py"
      - "scripts/build_service_integration_worklist.py"

permissions:
  contents: write

concurrency:
  group: newsletter-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve report date
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.report_date }}" ]; then
            echo "report_date=${{ inputs.report_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "report_date=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build daily newsletter data
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          mkdir -p db data/raw/daily_news exports/daily_news
          if [ -z "${NAVER_CLIENT_ID:-}" ] || [ -z "${NAVER_CLIENT_SECRET:-}" ]; then
            echo "::warning::NAVER_CLIENT_ID and NAVER_CLIENT_SECRET are not configured; Naver News sources will be skipped."
          fi
          python3 services/newsletter/src/run_daily_news_pipeline.py \
            --date "${{ steps.date.outputs.report_date }}" \
            --allow-insecure-ssl \
            --google-date-window

      - name: Build static newsletter site
        run: |
          python3 services/newsletter/src/build_newsletter_deploy.py --date "${{ steps.date.outputs.report_date }}"
          python3 - <<'PY'
          import json
          from pathlib import Path

          site = Path("services/newsletter/deploy/site")
          health = json.loads((site / "health.json").read_text(encoding="utf-8"))
          print(json.dumps(health, ensure_ascii=False, indent=2))
          if not (site / "index.html").exists():
              raise SystemExit("index.html was not generated")
          if not (site / "daily-news.html").exists():
              raise SystemExit("daily-news.html was not generated")
          PY

      - name: Publish gh-pages branch
        shell: bash
        run: |
          publish_dir="$(mktemp -d)"
          cp -R services/newsletter/deploy/site/. "$publish_dir"/
          cd "$publish_dir"
          git init -q
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy newsletter ${{ steps.date.outputs.report_date }}" >/dev/null
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin gh-pages
