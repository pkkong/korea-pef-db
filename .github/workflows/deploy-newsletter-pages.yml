name: Deploy newsletter to GitHub Pages

on:
  schedule:
    # Daily 08:37 Asia/Seoul. Avoid top-of-hour/half-hour slots, which GitHub can delay or drop under load.
    - cron: "37 23 * * *"
    # Retry windows keep the daily issue fresh without relying on one scheduled slot.
    - cron: "17 0 * * *"
    - cron: "47 0 * * *"
    - cron: "17 1 * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date in YYYY-MM-DD. Leave blank for today's date in Asia/Seoul."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: newsletter-pages
  cancel-in-progress: false

env:
  NEWSLETTER_PUBLIC_REPO: pkkong/kpef-newsletter
  NEWSLETTER_PUBLIC_BRANCH: gh-pages
  NEWSLETTER_PUBLIC_URL: https://pkkong.github.io/kpef-newsletter/
  NEWSLETTER_APP_URL: https://kpef-newsletter.vercel.app
  NEWSLETTER_BUILD_SERVICES: newsletter
  NEWSLETTER_LIMIT_PER_SOURCE: "20"
  NEWSLETTER_CANDIDATE_LIMIT_PER_SOURCE: "8"
  NEWSLETTER_RUN_TIMEOUT_SECONDS: "720"
  NEWSLETTER_LP_LIMIT_PER_SOURCE: "50"
  NEWSLETTER_AI_PROVIDER: local
  NEWSLETTER_AI_APPLY_SECTIONS: "0"
  NEWSLETTER_STRICT_ICON_CHECK: "0"
  NEWSLETTER_SKIP_BRAND_ASSET_DOWNLOADS: "1"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Resolve report date
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.report_date }}" ]; then
            echo "report_date=${{ inputs.report_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "report_date=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check public freshness
        id: freshness
        shell: bash
        run: |
          python3 - "${{ steps.date.outputs.report_date }}" "${NEWSLETTER_PUBLIC_URL}" "${NEWSLETTER_APP_URL}" "${{ github.event_name }}" <<'PY'
          import json
          import os
          import sys
          import time
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          report_date = sys.argv[1]
          mirror_base_url = sys.argv[2].rstrip("/")
          app_base_url = sys.argv[3].rstrip("/")
          event_name = sys.argv[4]

          should_run = True
          reason = "manual run" if event_name != "schedule" else "scheduled freshness check"
          mirror_date = ""
          mirror_article_count = 0
          mirror_archive_count = 0
          app_date = ""
          app_article_count = 0
          app_data_source = ""

          def fetch_json(url: str):
              req = Request(
                  f"{url}{'&' if '?' in url else '?'}freshness={int(time.time())}-{report_date}",
                  headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
              )
              with urlopen(req, timeout=15) as response:
                  return json.loads(response.read().decode("utf-8"))

          if event_name == "schedule":
              mirror_fresh = False
              app_fresh = False
              mirror_error = ""
              app_error = ""
              try:
                  health = fetch_json(f"{mirror_base_url}/health.json")
                  archive = fetch_json(f"{mirror_base_url}/archive.json")
                  mirror_date = str(health.get("report_date") or "")
                  mirror_article_count = int(health.get("article_count") or 0)
                  entry = next(
                      (row for row in archive if isinstance(row, dict) and row.get("reportDate") == report_date),
                      None,
                  )
                  mirror_archive_count = len(entry.get("articles") or []) if isinstance(entry, dict) else 0
                  mirror_fresh = (
                      mirror_date == report_date
                      and mirror_article_count > 0
                      and mirror_archive_count == mirror_article_count
                  )
              except (OSError, URLError, json.JSONDecodeError, ValueError) as exc:
                  mirror_error = str(exc)

              try:
                  app_health = fetch_json(f"{app_base_url}/health.json?refresh=1")
                  app_date = str(app_health.get("report_date") or "")
                  app_article_count = int(app_health.get("article_count") or 0)
                  app_data_source = str(app_health.get("data_source") or "")
                  app_fresh = (
                      app_date == report_date
                      and app_article_count > 0
                      and app_data_source == "supabase"
                  )
              except (OSError, URLError, json.JSONDecodeError, ValueError) as exc:
                  app_error = str(exc)

              if mirror_fresh and app_fresh:
                  should_run = False
                  reason = (
                      "newsletter already fresh "
                      f"(mirror={mirror_date}/{mirror_article_count}, "
                      f"app={app_date}/{app_article_count}/{app_data_source})"
                  )
              else:
                  reason = (
                      "newsletter stale "
                      f"(mirror={mirror_date or 'missing'}/{mirror_article_count}/{mirror_archive_count}"
                      f"{' error=' + mirror_error if mirror_error else ''}, "
                      f"app={app_date or 'missing'}/{app_article_count}/{app_data_source or 'missing'}"
                      f"{' error=' + app_error if app_error else ''}, expected={report_date})"
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
              output.write(f"reason={reason}\n")
              output.write(f"public_date={mirror_date}\n")
              output.write(f"public_article_count={mirror_article_count}\n")
              output.write(f"public_archive_count={mirror_archive_count}\n")
              output.write(f"app_date={app_date}\n")
              output.write(f"app_article_count={app_article_count}\n")
              output.write(f"app_data_source={app_data_source}\n")

          print(f"newsletter_freshness should_run={should_run} reason={reason}")
          PY

      - name: Skip already fresh scheduled issue
        if: steps.freshness.outputs.should_run != 'true'
        run: |
          echo "Skipping scheduled publish: ${{ steps.freshness.outputs.reason }}"

      - name: Check automation readiness
        if: steps.freshness.outputs.should_run == 'true'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NEWSLETTER_PUBLIC_REPO_TOKEN: ${{ secrets.NEWSLETTER_PUBLIC_REPO_TOKEN }}
        shell: bash
        run: |
          {
            echo "### Newsletter GitHub Actions readiness"
            echo ""
            echo "| Secret | Status |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          missing_required=0

          check_secret() {
            local name="$1"
            local value="$2"
            local required="$3"
            local missing_message="$4"

            if [ -n "$value" ]; then
              echo "| \`$name\` | configured |" >> "$GITHUB_STEP_SUMMARY"
              return
            fi

            echo "| \`$name\` | missing - $missing_message |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$required" = "required" ]; then
              echo "::error::$name is required. $missing_message"
              missing_required=1
            else
              echo "::warning::$name is not configured. $missing_message"
            fi
          }

          check_secret "NAVER_CLIENT_ID" "${NAVER_CLIENT_ID:-}" "required" "Active Naver News sources cannot be collected."
          check_secret "NAVER_CLIENT_SECRET" "${NAVER_CLIENT_SECRET:-}" "required" "Active Naver News sources cannot be collected."
          check_secret "NEWSLETTER_PUBLIC_REPO_TOKEN" "${NEWSLETTER_PUBLIC_REPO_TOKEN:-}" "required" "Publishing to ${NEWSLETTER_PUBLIC_REPO} will fail."

          if [ -z "${NEWSLETTER_PUBLIC_REPO_TOKEN:-}" ]; then
            echo "::error::NEWSLETTER_PUBLIC_REPO_TOKEN is required to publish ${NEWSLETTER_PUBLIC_REPO}."
            echo "::error::Create a fine-grained GitHub token with Contents read/write access to ${NEWSLETTER_PUBLIC_REPO}, then save it as this repository secret."
          fi

          if [ "$missing_required" -ne 0 ]; then
            exit 1
          fi

      - name: Build daily newsletter data
        if: steps.freshness.outputs.should_run == 'true'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          mkdir -p db data/raw/daily_news exports/daily_news
          timeout "${NEWSLETTER_RUN_TIMEOUT_SECONDS}" python3 services/newsletter/src/run_daily_news_pipeline.py \
            --date "${{ steps.date.outputs.report_date }}" \
            --limit-per-source "${NEWSLETTER_LIMIT_PER_SOURCE}" \
            --candidate-limit-per-source "${NEWSLETTER_CANDIDATE_LIMIT_PER_SOURCE}" \
            --brief-limit 30 \
            --review-limit 80 \
            --allow-insecure-ssl \
            --google-date-window \
            --require-previous-archive

      - name: Build newsletter quality files
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          python3 services/newsletter/src/build_newsletter_source_audit.py \
            --date "${{ steps.date.outputs.report_date }}"
          NEWSLETTER_AI_APPLY_SECTIONS="${NEWSLETTER_AI_APPLY_SECTIONS}" \
            python3 services/newsletter/src/enrich_daily_news_ai.py \
              --date "${{ steps.date.outputs.report_date }}" \
              --provider "${NEWSLETTER_AI_PROVIDER}"

      - name: Build static newsletter site
        if: steps.freshness.outputs.should_run == 'true'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          echo "::group::Build site bundle"
          timeout 300 python3 scripts/build_newsletter_bundle.py \
            --date "${{ steps.date.outputs.report_date }}" \
            --require-archive-seed
          echo "::endgroup::"
          echo "::group::Check generated files"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          site = Path("services/newsletter/deploy/site")
          requested_services = {
              part.strip().lower()
              for chunk in os.environ.get("NEWSLETTER_BUILD_SERVICES", "newsletter").split(",")
              for part in chunk.split()
              if part.strip()
          }
          if not requested_services or "all" in requested_services:
              requested_services = {"newsletter", "lp", "gp"}
          health = json.loads((site / "health.json").read_text(encoding="utf-8"))
          print(json.dumps(health, ensure_ascii=False, indent=2))
          required = {
              "index.html",
              "daily-news.html",
              "archive.json",
              "health.json",
              ".nojekyll",
              "assets/service.css",
              "assets/service.js",
              "apple-touch-icon.png",
          }
          if "lp" in requested_services:
              required.update({"lp-notices.html", "lp-official-notices.html"})
          if "gp" in requested_services:
              required.update({"gps.html", "market.html"})
          missing = [path for path in required if not (site / path).exists()]
          if missing:
              raise SystemExit(f"Missing generated files: {', '.join(sorted(missing))}")
          if health["article_count"] <= 0:
              raise SystemExit("article_count is 0; keeping the existing public newsletter instead of publishing an empty issue")
          if "lp" in requested_services and health["lp_monitor_count"] <= 0:
              print("WARNING: lp_monitor_count is 0; publishing can continue because LP monitor is not the core newsletter.")
          archive = json.loads((site / "archive.json").read_text(encoding="utf-8"))
          print(f"archive_count={len(archive)}")
          PY
          echo "::endgroup::"
          echo "::group::Validate newsletter pipeline"
          timeout 120 python3 services/newsletter/src/validate_daily_news_pipeline.py \
            --date "${{ steps.date.outputs.report_date }}" \
            --public-dir services/newsletter/deploy/site \
            --site-dir services/newsletter/deploy/site
          echo "::endgroup::"
          echo "::group::Check brand icons"
          timeout 120 python3 services/newsletter/src/check_newsletter_brand_icons.py \
            --site-dir services/newsletter/deploy/site \
            --report-date "${{ steps.date.outputs.report_date }}"
          echo "::endgroup::"

      - name: Publish public newsletter mirror
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        env:
          NEWSLETTER_PUBLIC_REPO_TOKEN: ${{ secrets.NEWSLETTER_PUBLIC_REPO_TOKEN }}
        run: |
          publish_dir="$(mktemp -d)"
          git clone --depth 1 --branch "${NEWSLETTER_PUBLIC_BRANCH}" "https://x-access-token:${NEWSLETTER_PUBLIC_REPO_TOKEN}@github.com/${NEWSLETTER_PUBLIC_REPO}.git" "$publish_dir/site-repo"
          normalized_services="${NEWSLETTER_BUILD_SERVICES//[[:space:]]/}"
          service_selected() {
            local service="$1"
            case ",$normalized_services," in
              *,all,*|*,"$service",*) return 0 ;;
              *) return 1 ;;
            esac
          }
          if service_selected lp || service_selected gp || service_selected wiki; then
            find "$publish_dir/site-repo" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -R services/newsletter/deploy/site/. "$publish_dir/site-repo"/
          else
            mkdir -p "$publish_dir/site-repo/assets"
            for path in index.html daily-news.html archive.json health.json .nojekyll robots.txt 404.html site.webmanifest apple-touch-icon.png; do
              if [ -e "services/newsletter/deploy/site/$path" ]; then
                cp -R "services/newsletter/deploy/site/$path" "$publish_dir/site-repo/$path"
              fi
            done
            cp services/newsletter/deploy/site/assets/service.css "$publish_dir/site-repo/assets/service.css"
            cp services/newsletter/deploy/site/assets/service.js "$publish_dir/site-repo/assets/service.js"
            if [ -d services/newsletter/deploy/site/assets/brand-marks ]; then
              rm -rf "$publish_dir/site-repo/assets/brand-marks"
              cp -R services/newsletter/deploy/site/assets/brand-marks "$publish_dir/site-repo/assets/brand-marks"
            fi
          fi
          cd "$publish_dir/site-repo"
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No public newsletter changes to publish."
            exit 0
          fi
          git commit -m "Deploy newsletter ${{ steps.date.outputs.report_date }} from GitHub Actions" >/dev/null
          git push origin "${NEWSLETTER_PUBLIC_BRANCH}"
          echo "Published ${NEWSLETTER_PUBLIC_URL}"

      - name: Verify public newsletter
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        run: |
          python3 - "${{ steps.date.outputs.report_date }}" "${NEWSLETTER_PUBLIC_URL}" \
            "services/newsletter/deploy/site/health.json" \
            "services/newsletter/deploy/site/archive.json" <<'PY'
          import json
          import sys
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          report_date = sys.argv[1]
          base_url = sys.argv[2].rstrip("/")
          expected_health = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          expected_archive = json.loads(Path(sys.argv[4]).read_text(encoding="utf-8"))
          expected_built_at = str(expected_health.get("built_at") or "")
          expected_article_count = int(expected_health.get("article_count") or 0)
          expected_entry = next(
              (row for row in expected_archive if isinstance(row, dict) and row.get("reportDate") == report_date),
              None,
          )
          expected_archive_count = len(expected_entry.get("articles") or []) if isinstance(expected_entry, dict) else 0
          if expected_article_count <= 0 or expected_archive_count != expected_article_count:
              raise SystemExit(
                  "local newsletter artifact is invalid before public verification "
                  f"(health={expected_article_count}, archive={expected_archive_count})"
              )
          deadline = time.time() + 180
          last_error = ""

          def fetch_json(path: str):
              req = Request(
                  f"{base_url}/{path}?verify={int(time.time())}-{report_date}",
                  headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
              )
              with urlopen(req, timeout=15) as response:
                  return json.loads(response.read().decode("utf-8"))

          while time.time() <= deadline:
              try:
                  health = fetch_json("health.json")
                  archive = fetch_json("archive.json")
                  if health.get("report_date") != report_date:
                      raise RuntimeError(f"health report_date={health.get('report_date')} expected={report_date}")
                  if health.get("services") != "newsletter":
                      raise RuntimeError(f"health services={health.get('services')} expected=newsletter")
                  if str(health.get("built_at") or "") != expected_built_at:
                      raise RuntimeError(
                          f"health built_at={health.get('built_at')} expected={expected_built_at}"
                      )
                  article_count = int(health.get("article_count") or 0)
                  if article_count != expected_article_count:
                      raise RuntimeError(
                          f"health article_count={article_count} expected={expected_article_count}"
                      )
                  for key in ["lp_monitor_count", "gp_count", "gp_profile_page_count"]:
                      if int(health.get(key) or 0) != 0:
                          raise RuntimeError(f"newsletter-only health {key}={health.get(key)} expected=0")
                  entry = next((row for row in archive if isinstance(row, dict) and row.get("reportDate") == report_date), None)
                  if entry is None:
                      raise RuntimeError(f"archive missing reportDate={report_date}")
                  archive_count = len(entry.get("articles") or [])
                  if archive_count != expected_archive_count:
                      raise RuntimeError(f"archive article_count={archive_count} expected={expected_archive_count}")
                  print(f"public_verify_status=ok report_date={report_date} health_articles={article_count} archive_articles={archive_count}")
                  raise SystemExit(0)
              except Exception as exc:
                  last_error = str(exc)
                  print(f"public_verify_wait={last_error}")
                  time.sleep(10)

          raise SystemExit(f"public verification failed: {last_error}")
          PY

      - name: Build Supabase newsletter payload
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          python3 services/newsletter/src/sync_newsletter_supabase.py \
            --date "${{ steps.date.outputs.report_date }}" \
            --archive services/newsletter/deploy/site/archive.json \
            --payload-out exports/daily_news/newsletter_supabase_payload.json

      - name: Sync Supabase newsletter read model
        if: steps.freshness.outputs.should_run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are required to refresh the Vercel newsletter app."
            echo "::notice::The GitHub Pages mirror was already published and verified before this Supabase step."
            exit 1
          fi
          python3 services/newsletter/src/sync_newsletter_supabase.py \
            --date "${{ steps.date.outputs.report_date }}" \
            --archive services/newsletter/deploy/site/archive.json \
            --payload-out exports/daily_news/newsletter_supabase_payload.json \
            --apply

      - name: Verify Vercel newsletter app
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        run: |
          python3 - "${{ steps.date.outputs.report_date }}" "${NEWSLETTER_APP_URL}" \
            "services/newsletter/deploy/site/health.json" \
            "services/newsletter/deploy/site/archive.json" <<'PY'
          import json
          import sys
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          report_date = sys.argv[1]
          app_base_url = sys.argv[2].rstrip("/")
          expected_health = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          expected_archive = json.loads(Path(sys.argv[4]).read_text(encoding="utf-8"))
          expected_article_count = int(expected_health.get("article_count") or 0)
          expected_entry = next(
              (row for row in expected_archive if isinstance(row, dict) and row.get("reportDate") == report_date),
              None,
          )
          expected_archive_count = len(expected_entry.get("articles") or []) if isinstance(expected_entry, dict) else 0
          if expected_article_count <= 0 or expected_archive_count != expected_article_count:
              raise SystemExit(
                  "local newsletter artifact is invalid before Vercel verification "
                  f"(health={expected_article_count}, archive={expected_archive_count})"
              )

          deadline = time.time() + 180
          last_error = ""

          def fetch_json(path: str):
              req = Request(
                  f"{app_base_url}/{path}?refresh=1&verify={int(time.time())}-{report_date}",
                  headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
              )
              with urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          while time.time() <= deadline:
              try:
                  health = fetch_json("health.json")
                  archive = fetch_json("archive.json")
                  if health.get("report_date") != report_date:
                      raise RuntimeError(f"app report_date={health.get('report_date')} expected={report_date}")
                  if health.get("data_source") != "supabase":
                      raise RuntimeError(f"app data_source={health.get('data_source')} expected=supabase")
                  article_count = int(health.get("article_count") or 0)
                  if article_count != expected_article_count:
                      raise RuntimeError(f"app article_count={article_count} expected={expected_article_count}")
                  entry = next((row for row in archive if isinstance(row, dict) and row.get("reportDate") == report_date), None)
                  if entry is None:
                      raise RuntimeError(f"app archive missing reportDate={report_date}")
                  archive_count = len(entry.get("articles") or [])
                  if archive_count != expected_archive_count:
                      raise RuntimeError(f"app archive_count={archive_count} expected={expected_archive_count}")
                  print(
                      "vercel_verify_status=ok "
                      f"report_date={report_date} health_articles={article_count} archive_articles={archive_count}"
                  )
                  raise SystemExit(0)
              except Exception as exc:
                  last_error = str(exc)
                  print(f"vercel_verify_wait={last_error}")
                  time.sleep(10)

          raise SystemExit(f"vercel verification failed: {last_error}")
          PY
