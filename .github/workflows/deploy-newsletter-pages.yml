name: Deploy newsletter to GitHub Pages

on:
  schedule:
    # Daily 08:30 Asia/Seoul.
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date in YYYY-MM-DD. Leave blank for today's date in Asia/Seoul."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: newsletter-pages
  cancel-in-progress: false

env:
  NEWSLETTER_PUBLIC_REPO: pkkong/kpef-newsletter
  NEWSLETTER_PUBLIC_URL: https://pkkong.github.io/kpef-newsletter/
  NEWSLETTER_SOURCE_CODES: >-
    naver_pef_core_samo,naver_pef_core_pef,naver_pef_deal_sale,
    naver_pef_deal_acquisition,naver_pef_gp_mbk,naver_pef_lp_commitment,
    naver_pef_lp_nps,naver_pef_lp_mutual_aid,naver_pef_fundraising,
    naver_pef_credit,naver_pef_portfolio_valueup,naver_pef_regulation,
    naver_publisher_thebell,naver_publisher_newstomato,
    naver_publisher_newstomato_pef,naver_publisher_newstomato_mna,
    naver_publisher_newstof,naver_publisher_newstof_pef,
    naver_publisher_newstof_mna,naver_ai_pe_gaic,
    naver_pef_growth_fund,naver_publisher_dealsite_pef,
    naver_publisher_dealsite_growth_fund,naver_publisher_dealsite_lp_scope,
    naver_pef_deal_pe_ub,naver_pef_deal_spa,
    google_pef_named_gp_watch,google_pef_mna_process_watch,
    google_lp_people_watch,newstop_private_equity,dealsite_pe_category,
    kgnews_economy_lp_people

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Resolve report date
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.report_date }}" ]; then
            echo "report_date=${{ inputs.report_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "report_date=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check automation readiness
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NEWSLETTER_PUBLIC_REPO_TOKEN: ${{ secrets.NEWSLETTER_PUBLIC_REPO_TOKEN }}
        shell: bash
        run: |
          {
            echo "### Newsletter GitHub Actions readiness"
            echo ""
            echo "| Secret | Status |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          missing_required=0

          check_secret() {
            local name="$1"
            local value="$2"
            local required="$3"
            local missing_message="$4"

            if [ -n "$value" ]; then
              echo "| \`$name\` | configured |" >> "$GITHUB_STEP_SUMMARY"
              return
            fi

            echo "| \`$name\` | missing - $missing_message |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$required" = "required" ]; then
              echo "::error::$name is required. $missing_message"
              missing_required=1
            else
              echo "::warning::$name is not configured. $missing_message"
            fi
          }

          check_secret "NAVER_CLIENT_ID" "${NAVER_CLIENT_ID:-}" "recommended" "Naver News sources will be skipped."
          check_secret "NAVER_CLIENT_SECRET" "${NAVER_CLIENT_SECRET:-}" "recommended" "Naver News sources will be skipped."
          check_secret "NEWSLETTER_PUBLIC_REPO_TOKEN" "${NEWSLETTER_PUBLIC_REPO_TOKEN:-}" "required" "Publishing to ${NEWSLETTER_PUBLIC_REPO} will fail."

          if [ -z "${NEWSLETTER_PUBLIC_REPO_TOKEN:-}" ]; then
            echo "::error::NEWSLETTER_PUBLIC_REPO_TOKEN is required to publish ${NEWSLETTER_PUBLIC_REPO}."
            echo "::error::Create a fine-grained GitHub token with Contents read/write access to ${NEWSLETTER_PUBLIC_REPO}, then save it as this repository secret."
          fi

          if [ "$missing_required" -ne 0 ]; then
            exit 1
          fi

      - name: Build daily newsletter data
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          mkdir -p db data/raw/daily_news exports/daily_news
          if [ -z "${NAVER_CLIENT_ID:-}" ] || [ -z "${NAVER_CLIENT_SECRET:-}" ]; then
            echo "::warning::NAVER_CLIENT_ID and NAVER_CLIENT_SECRET are not configured; Naver News sources will be skipped."
          fi
          python3 services/newsletter/src/run_daily_news_pipeline.py \
            --date "${{ steps.date.outputs.report_date }}" \
            --source-code "${NEWSLETTER_SOURCE_CODES//[[:space:]]/}" \
            --limit-per-source 5 \
            --brief-limit 30 \
            --review-limit 80 \
            --allow-insecure-ssl \
            --google-date-window

      - name: Build LP commitment monitor
        run: |
          python3 services/lp/src/build_lp_commitment_monitor.py \
            --date "${{ steps.date.outputs.report_date }}" \
            --days 180 \
            --limit-per-source 20 \
            --allow-insecure-ssl

      - name: Build static newsletter site
        run: |
          python3 services/newsletter/src/build_newsletter_deploy.py --date "${{ steps.date.outputs.report_date }}"
          python3 - <<'PY'
          import json
          from pathlib import Path

          site = Path("services/newsletter/deploy/site")
          health = json.loads((site / "health.json").read_text(encoding="utf-8"))
          print(json.dumps(health, ensure_ascii=False, indent=2))
          if not (site / "index.html").exists():
              raise SystemExit("index.html was not generated")
          if not (site / "daily-news.html").exists():
              raise SystemExit("daily-news.html was not generated")
          if not (site / "ktcu.html").exists():
              raise SystemExit("ktcu.html was not generated")
          if not (site / "lp-ktcu.html").exists():
              raise SystemExit("lp-ktcu.html was not generated")
          if not (site / "archive.json").exists():
              raise SystemExit("archive.json was not generated")
          if health["article_count"] <= 0:
              raise SystemExit("article_count is 0; keeping the existing public newsletter instead of publishing an empty issue")
          if health["lp_monitor_count"] <= 0:
              print("WARNING: lp_monitor_count is 0; publishing can continue because LP monitor is not the core newsletter.")
          archive = json.loads((site / "archive.json").read_text(encoding="utf-8"))
          print(f"archive_count={len(archive)}")
          PY

      - name: Publish public newsletter mirror
        shell: bash
        env:
          NEWSLETTER_PUBLIC_REPO_TOKEN: ${{ secrets.NEWSLETTER_PUBLIC_REPO_TOKEN }}
        run: |
          publish_dir="$(mktemp -d)"
          git clone --depth 1 --branch main "https://x-access-token:${NEWSLETTER_PUBLIC_REPO_TOKEN}@github.com/${NEWSLETTER_PUBLIC_REPO}.git" "$publish_dir/site-repo"
          find "$publish_dir/site-repo" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R services/newsletter/deploy/site/. "$publish_dir/site-repo"/
          cd "$publish_dir/site-repo"
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No public newsletter changes to publish."
            exit 0
          fi
          git commit -m "Deploy newsletter ${{ steps.date.outputs.report_date }} from GitHub Actions" >/dev/null
          git push origin main
          echo "Published ${NEWSLETTER_PUBLIC_URL}"
