name: Inspect remaining LP official board receipts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lp-program-collection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Capture bounded official lists and observed detail links without DB writes
        run: python3 scripts/inspect_lp_remaining_boards.py /tmp/lp-remaining-board-receipts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp-remaining-board-receipts
          path: /tmp/lp-remaining-board-receipts/
          retention-days: 7
          if-no-files-found: error
