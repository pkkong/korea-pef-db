name: Inspect LP collection diagnostics
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [initial, followup, mmaa_files, geps_pck_recovery, pck_kamco_recovery, pending_institutions, pending_contracts, central_contracts, kofia_transfer, association_collection, publication_waits]
        default: initial
      connection_mode:
        description: Read-only publication diagnostic connection mode
        type: choice
        options: [transaction, session]
        default: transaction
      verify_framing_recovery:
        description: Association collection only; inject one short-read before real KOFIA17 recovery
        type: boolean
        default: false
      verify_regional_recovery:
        description: Association collection only; inject two native short-reads before actual Seoul recovery
        type: boolean
        default: false
      transfer_page_encoding:
        description: KOFIA read-only transfer diagnostic pagination encoding
        type: choice
        options: [identity, compressed]
        default: identity
permissions:
  contents: read
concurrency:
  group: ${{ inputs.profile == 'publication_waits' && 'lp-publication-diagnostic' || 'lp-program-collection' }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ${{ inputs.profile == 'publication_waits' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 10
    env:
      LP_INSPECTION_PROFILE: ${{ inputs.profile || 'initial' }}
      LP_DIAGNOSTIC_CONNECTION_MODE: ${{ inputs.connection_mode || 'transaction' }}
      LP_VERIFY_FRAMING_RECOVERY: ${{ inputs.verify_framing_recovery && 'true' || 'false' }}
      LP_VERIFY_REGIONAL_RECOVERY: ${{ inputs.verify_regional_recovery && 'true' || 'false' }}
      LP_TRANSFER_PAGE_ENCODING: ${{ inputs.transfer_page_encoding || 'identity' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test bounded pending institution inspection
        if: inputs.profile == 'pending_institutions'
        run: python3 -m unittest scripts.tests.test_inspect_lp_pending_boards
      - name: Capture bounded official lists and observed detail links without DB writes
        if: inputs.profile != 'publication_waits' && inputs.profile != 'pending_contracts' && inputs.profile != 'kofia_transfer' && inputs.profile != 'central_contracts' && inputs.profile != 'association_collection'
        run: python3 scripts/inspect_lp_remaining_boards.py /tmp/lp-remaining-board-receipts "$LP_INSPECTION_PROFILE"
      - name: Test and inspect observed NPS and CWMA request contracts
        if: inputs.profile == 'pending_contracts'
        run: |
          python3 -m unittest scripts.tests.test_inspect_lp_pending_contracts
          python3 scripts/inspect_lp_pending_contracts.py --output /tmp/lp-remaining-board-receipts
      - name: Inspect bounded KOFIA transfer and observed pagination without publication
        if: inputs.profile == 'kofia_transfer'
        run: |
          python3 -m unittest scripts.tests.test_inspect_lp_kofia_transfer
          python3 scripts/inspect_lp_kofia_transfer.py --output /tmp/lp-remaining-board-receipts --page-encoding "$LP_TRANSFER_PAGE_ENCODING"
      - name: Collect association boards and retain retry allocation without publication
        if: inputs.profile == 'association_collection'
        env:
          LP_SOURCE_WORKER_TOKEN: ${{ secrets.LP_SOURCE_WORKER_TOKEN }}
        run: |
          python3 -m pip install 'pypdf==6.10.0' 'olefile==0.47'
          python3 -m unittest services.lp.tests.test_collect_shared_lp_notices
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          from unittest.mock import patch
          from services.lp.src import collect_shared_lp_notices as shared
          controlled=os.environ['LP_VERIFY_FRAMING_RECOVERY']=='true'
          regional_controlled=os.environ['LP_VERIFY_REGIONAL_RECOVERY']=='true'
          assert not (controlled and regional_controlled),'Choose one recovery diagnostic'
          if regional_controlled:
              assert os.environ.get('LP_SOURCE_WORKER_TOKEN'),'Regional diagnostic requires configured transport'
              original=shared._fetch_bytes_once;original_curl=shared._fetch_bytes_curl;injected=[]
              def short_read(url,referer=None,**options):
                  if url==shared.CHANNELS['kofia_17'] and not injected:
                      injected.append('native')
                      raise shared.IncompleteHTML('controlled native short-read')
                  return original(url,referer,**options)
              def short_http10(url,referer=None,**options):
                  if url==shared.CHANNELS['kofia_17'] and options.get('http_version')=='1.0' and injected==['native']:
                      injected.append('http10')
                      raise shared.IncompleteHTML('controlled HTTP1.0 short-read')
                  return original_curl(url,referer,**options)
              with patch.object(shared,'_fetch_bytes_once',side_effect=short_read),patch.object(shared,'_fetch_bytes_curl',side_effect=short_http10):
                  report=shared.collect(pages=3,channels={'kofia_17':shared.CHANNELS['kofia_17']},aliases={})
              report['diagnostic_fault']={'kind':'controlled_native_short_reads','count':len(injected)}
              events=report['coverage']['transport']['events']
          elif controlled:
              original=shared._fetch_bytes_once;injected=[]
              def short_read(url,referer=None,**options):
                  if url==shared.CHANNELS['kofia_17'] and not injected:
                      injected.append(url)
                      raise shared.IncompleteHTML('controlled diagnostic short-read')
                  return original(url,referer,**options)
              with patch.object(shared,'_fetch_bytes_once',side_effect=short_read):
                  report=shared.collect(pages=3,channels={'kofia_17':shared.CHANNELS['kofia_17']},aliases={})
              report['diagnostic_fault']={'kind':'controlled_short_read','count':len(injected)}
              events=report['coverage']['transport']['events']
          else:
              report=shared.collect(pages=3)
          root=Path('/tmp/lp-remaining-board-receipts');root.mkdir(exist_ok=True)
          (root/'association-collection.json').write_text(json.dumps(report,ensure_ascii=False))
          coverage=report['coverage'];transport=coverage['transport']
          failures=[h for h in report['holds'] if h['stage'] in {'listing','detail'}]
          print(json.dumps({'pages':coverage['channel_pages'],'extra_attempts_used':transport['extra_attempts_used'],
                            'source_errors':failures,'other_holds':len(report['holds'])-len(failures)},ensure_ascii=False))
          assert transport['extra_attempts_used']<=4
          assert not failures,'Official association list/detail errors remain; retained proof is partial'
          if regional_controlled:
              assert len(injected)==2 and len(events)==5
              assert all(e['retry'] and not e.get('regional_recovery') for e in events[:2])
              assert all(e.get('regional_recovery') and e['outcome']=='ok' for e in events[2:])
              assert transport['extra_attempts_used']==2
              assert len(report['coverage']['channel_pages']['kofia_17']['pages'])==3
          if controlled:
              assert len(injected)==1 and len(events)>=4
              assert events[0]['retry'] and all(e['framing_recovery'] or e.get('regional_recovery') for e in events[1:])
              assert sum(e['outcome']=='ok' for e in events)==3
              assert len(report['coverage']['channel_pages']['kofia_17']['pages'])==3
          PYCODE
      - name: Inspect observed NH and Suhyup public search forms
        if: inputs.profile == 'central_contracts'
        run: |
          python3 -m unittest services.lp.tests.test_lp_board_adapter_nh scripts.tests.test_inspect_lp_central_contracts
          python3 scripts/inspect_lp_central_contracts.py --output /tmp/lp-remaining-board-receipts
      - name: Install read-only publication inspector
        if: inputs.profile == 'publication_waits'
        run: python3 -m pip install 'psycopg[binary]==3.2.10'
      - name: Inspect only LP publication waits without writes or query contents
        if: inputs.profile == 'publication_waits'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          import psycopg
          from psycopg.rows import dict_row
          options={}
          if os.environ['LP_DIAGNOSTIC_CONNECTION_MODE']=='session':
              configured=psycopg.conninfo.conninfo_to_dict(os.environ['SUPABASE_DB_URL'])
              host=configured.get('host','')
              assert host.endswith('.pooler.supabase.com') and ',' not in host and configured.get('port')=='6543','Session diagnostic requires a configured Supabase transaction pooler'
              options['port']=5432
          with psycopg.connect(os.environ['SUPABASE_DB_URL'],connect_timeout=10,row_factory=dict_row,application_name='lp-publication-diagnostic',**options) as conn:
              conn.execute('SET TRANSACTION READ ONLY')
              conn.execute("SET LOCAL statement_timeout='10s'")
              rows=conn.execute("""
                  SELECT pid,state,wait_event_type,wait_event,
                    now()-xact_start AS transaction_age,now()-query_start AS query_age,
                    pg_blocking_pids(pid) AS blocking_pids,
                    CASE WHEN query LIKE 'INSERT INTO lp_program_private.documents%%' THEN 'evidence_storage'
                         WHEN query LIKE 'INSERT INTO lp_program_private.collection_runs%%' THEN 'collection_report_storage'
                         WHEN query LIKE 'INSERT INTO lp_program_private.program_state%%' THEN 'public_state_storage'
                         WHEN query LIKE 'SELECT pg_advisory_xact_lock(728160921)%%' THEN 'publication_lock'
                         WHEN query='COMMIT' THEN 'publication_commit'
                         ELSE 'lp_read_or_validation' END AS phase
                  FROM pg_stat_activity
                  WHERE pid<>pg_backend_pid() AND datname=current_database()
                    AND (application_name='lp-program-publisher' OR query LIKE '%%lp_program_private%%' OR query LIKE 'SELECT pg_advisory_xact_lock(728160921)%%')
                  ORDER BY pid
              """).fetchall()
          root=Path('/tmp/lp-remaining-board-receipts');root.mkdir(exist_ok=True)
          (root/'publication-waits.json').write_text(json.dumps(rows,default=str))
          print(json.dumps(rows,default=str))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp-remaining-board-receipts
          path: /tmp/lp-remaining-board-receipts/
          retention-days: 7
          if-no-files-found: error
