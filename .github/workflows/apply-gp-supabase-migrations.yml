name: Apply GP Supabase migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gp-publish
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Require database credentials
        run: test -n "$SUPABASE_DB_URL"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      # Earlier profile migrations temporarily disallow People page paths.
      # Replaying them against a populated public model would fail validation.
      # The existing FSS/People schema is a prerequisite for this upgrade.
      - name: Apply GP canonical safety migration
        run: |
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file services/newsletter/supabase/migrations/20260906100000_gp_canonical_safe_publish.sql
